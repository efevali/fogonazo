<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2010">
<title>Mahjong · partida</title>
<style>
/* A mahjong match: the coffee table seen from above (P-006), with the tiles of S-19 drawn on it, the pad written in
   pencil and Undo, Hint and Shuffle on the bone scoring sticks. The pause and the end of a board, paper cards (S-21).
   Design space: 915 x 412. The stage is sized to fit the screen; 1em = 1rem = one design unit (see fit). */
@font-face { font-family: Barlow; font-weight: 600; src: url(../comun/fuentes/barlow-semi-condensed-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Barlow; font-weight: 700; src: url(../comun/fuentes/barlow-semi-condensed-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Caveat; font-weight: 600; src: url(../comun/fuentes/caveat-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: "Mahjong JP"; font-weight: 700; src: url(../comun/fuentes/noto-serif-jp-mahjong-700.woff2) format('woff2'); }
:root { --wood: #4a2a16; --pen: #1d3a94; --pencil: #3b3a36; --label: #7a2a20; --engraved: #5a4630; --amber: #ffb648; }
html, body { margin: 0; height: 100%; background: var(--wood); overflow: hidden; }
body { font-family: Barlow, "Arial Narrow", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
button:focus { outline: none; }

#stage { position: fixed; left: 0; top: 0; font-size: 1px; width: 915em; height: 412em; overflow: clip; }
#stage > * { position: absolute; }
/* the painted table covers the width; the phone loses the same strip above and below */
#bg { left: 0; top: -49.4em; width: 915em; height: 510.8em; display: block; pointer-events: none; }

/* the pad, written over the painted one */
#pad { left: 16rem; top: 22rem; width: 156rem; height: 186rem; box-sizing: border-box; padding: 8rem 14rem; color: var(--pencil); font: 600 21rem/24rem Caveat, cursive; pointer-events: none; }
#pad .t { font: 700 13rem/1 Barlow; letter-spacing: .18em; color: var(--label); margin-top: 4rem; text-transform: uppercase; }
#pad .reloj { font-size: 44rem; line-height: 1; margin: 4rem 0 2rem; color: var(--pen); font-variant-numeric: tabular-nums; }
#pad b { font-weight: 600; color: var(--pen); }
#pad .cadena { color: #b8322a; transform: rotate(-3deg); transform-origin: left; }

/* the actions, engraved on the painted scoring sticks */
.palito { left: 21rem; width: 145rem; height: 29rem; border-radius: 15rem; font: 700 14rem Barlow; letter-spacing: .2em; color: var(--engraved);
  text-shadow: 0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(60,40,20,.25); }
.palito:active { background: rgba(255,240,200,.25); }

/* the tiles: they end at x = 800, a safety strip before the painted teapot (S-27) */
#tablero { left: 186rem; top: 8rem; width: 614rem; height: 396rem; }
#capa { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.ficha { position: absolute; width: 36em; height: 48em; font-size: inherit; }
.ficha svg.f { position: absolute; left: 0; top: 0; width: 42em; height: 56em; overflow: visible; pointer-events: none; }
.ficha .sombra { fill: rgba(20,8,0,.32); }
.ficha .dorso { fill: #2f6b4a; }
.ficha .canto { fill: #e6d8b8; }
.ficha .cara { fill: url(#hueso); stroke: rgba(80,60,30,.45); stroke-width: .8; }
/* S-23: a free tile, brighter; lower layers in the shade of the upper ones, so the height reads; a blocked tile, clearly
   darker */
.ficha .luz { fill: none; }
.ficha.libre .luz { fill: url(#huesoLuz); }
.ficha .tinte { fill: rgb(70 40 15 / var(--a, 0)); transition: fill .2s; }
.ficha.sel { transform: translateY(-2em); }
.ficha.sel .cara { stroke: #e0952c; stroke-width: 2.4; }
.ficha.sel .tinte { fill: rgba(255,190,90,.3); }
.ficha.pista { animation: pista .55s ease-in-out 4 alternate; }
@keyframes pista { from { filter: none; } to { filter: drop-shadow(0 0 5em #ffd27a) drop-shadow(0 0 2em #fff1c4); } }
.ficha.nop { animation: nop .26s; }
@keyframes nop { 25% { transform: translateX(-2em); } 75% { transform: translateX(2em); } }
.ficha.sale { animation: sale .24s ease-in forwards; pointer-events: none; }
@keyframes sale { to { transform: scale(1.15) translateY(-4em); opacity: 0; } }
.ficha.vuelve { animation: vuelve .25s ease-out; }
@keyframes vuelve { from { transform: scale(.7); opacity: 0; } }
.ficha.gira { animation: gira .34s ease-in-out; }
@keyframes gira { 50% { transform: scaleX(0); } }
.ficha.entra { animation: entra .35s ease-out backwards; animation-delay: var(--d); }
@keyframes entra { from { transform: translateY(-24em); opacity: 0; } }
.flota { position: absolute; transform: translate(-50%, 0); font: 700 15em Barlow; color: #fff; white-space: nowrap; pointer-events: none;
  text-shadow: 0 1px 2px rgba(0,0,0,.8), 0 0 6px rgba(0,0,0,.5); animation: flota .9s ease-out forwards; }
.flota.grande { font-size: 24em; color: var(--amber); }
@keyframes flota { from { opacity: 1; } to { opacity: 0; transform: translate(-50%, -26px); } }
#aviso { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(18,12,10,.78); color: #f3e6d0; font: 600 16rem Barlow;
  padding: 8rem 16rem; border-radius: 999rem; white-space: nowrap; pointer-events: none; }

/* pause and back, as in Fogonazo */
#pausa { left: 848rem; top: 14rem; width: 38rem; height: 38rem; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #4a4540, #1f1c1a);
  box-shadow: 0 3rem 6rem rgba(0,0,0,.5), inset 0 0 0 3rem #6d675f; }
#pausa::before, #pausa::after { content: ''; position: absolute; top: 11rem; width: 5rem; height: 16rem; background: #e9e1d3; border-radius: 1rem; }
#pausa::before { left: 13rem; } #pausa::after { right: 13rem; }
#volver { left: 773rem; top: 366rem; width: 124rem; height: 30rem; }
#volver svg { width: 100%; height: 100%; display: block; transform: rotate(-1.5deg); }

/* the pause and the end of a board: paper cards on the table (S-21) */
.sheet { left: 0; top: 0; width: 100%; height: 100%; display: grid; place-items: center; background: rgba(20,10,4,.55); }
.carta { width: 300rem; box-sizing: border-box; padding: 20rem 24rem 22rem; display: grid; justify-items: center; gap: 10rem; position: relative;
  background: linear-gradient(170deg, #f8f1df, #ece0c4); color: var(--pencil); border-radius: 3rem; transform: rotate(-1deg);
  box-shadow: 0 14rem 30rem rgba(0,0,0,.55); }
.carta h2 { margin: 0; font: 700 18rem Barlow; letter-spacing: .3em; color: var(--label); }
.carta .linea { font: 600 22rem/1.1 Caveat, cursive; text-align: center; }
.carta .linea b { font-weight: 600; color: var(--pen); }
.carta .grande { font: 600 52rem/1 Caveat, cursive; color: var(--pen); font-variant-numeric: tabular-nums; }
.carta .sello { position: absolute; right: -16rem; top: 10rem; transform: rotate(12deg); background: rgba(248,241,223,.6); border: 3rem solid #c0392b; color: #c0392b; border-radius: 4rem;
  padding: 3rem 8rem 2rem; font: 700 14rem Barlow; letter-spacing: .14em; opacity: .85; }
.palos { display: grid; gap: 10rem; margin-top: 4rem; }
.palo { width: 210rem; height: 32rem; border-radius: 16rem; position: relative; font: 700 14rem Barlow; letter-spacing: .16em; color: #4a3a26;
  background: linear-gradient(180deg, #fbf5e6, #e8dcc0 60%, #cfc1a0); box-shadow: 0 3rem 0 #9c8a66, 0 5rem 8rem rgba(0,0,0,.35); }
.palo::before, .palo::after { content: ''; position: absolute; top: 12rem; width: 8rem; height: 8rem; border-radius: 50%; background: #b8322a; }
.palo::before { left: 13rem; } .palo::after { right: 13rem; }
.palo.main { background: linear-gradient(180deg, #ffe7b0, #f2c76a 60%, #d9a443); box-shadow: 0 3rem 0 #9a7428, 0 5rem 8rem rgba(0,0,0,.35); }
.palo:active { transform: translateY(2rem); box-shadow: 0 1rem 0 #9c8a66; }

#rotate { position: fixed; inset: 0; display: none; place-items: center; background: rgba(20,10,4,.82); color: #f3e6d0;
  font: 600 18px/1.4 Barlow, sans-serif; text-align: center; padding: 24px; z-index: 5; }
@media (orientation: portrait) { #rotate { display: grid; } }
@media (prefers-reduced-motion: reduce) { .ficha, .flota { animation: none !important; } }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="fondo.webp" alt="" draggable="false">
  <div id="pad" aria-live="polite">
    <div class="t" id="nombre"></div>
    <div class="reloj" id="reloj">0:00</div>
    <div>quedan <b id="quedan"></b> pares</div>
    <div>récord <b id="rec">—</b></div>
    <div>puntos <b id="pts">0</b></div>
    <div class="cadena" id="cadena" hidden></div>
  </div>
  <button class="palito" id="b-deshacer" style="top:223rem" type="button">DESHACER</button>
  <button class="palito" id="b-pista" style="top:263rem" type="button">PISTA</button>
  <button class="palito" id="b-barajar" style="top:303rem" type="button">BARAJAR</button>
  <div id="tablero" role="application" aria-label="Tablero de mahjong"><div id="capa"></div><div id="aviso" role="status" hidden></div></div>
  <button id="pausa" type="button" aria-label="Pausa"></button>
  <button id="volver" type="button" aria-label="Volver al estuche"><svg viewBox="0 0 132 34" aria-hidden="true"><path d="M2,4 h126 l-4,13 l4,13 h-126 l4,-13 z" fill="#1c1c1c"/><text x="66" y="23" text-anchor="middle" font-family="Barlow" font-weight="700" font-size="14" letter-spacing="2.2" fill="#f4f1ea">◀ VOLVER</text></svg></button>

  <div class="sheet" id="menu" hidden>
    <div class="carta" role="dialog" aria-modal="true" aria-labelledby="tPausa">
      <h2 id="tPausa">PAUSA</h2>
      <div class="linea" id="pResumen"></div>
      <div class="palos">
        <button class="palo main" type="button" data-act="seguir">SEGUIR</button>
        <button class="palo" type="button" data-act="otra">REPARTIR DE NUEVO</button>
        <button class="palo" type="button" data-act="estuche">OTRO TABLERO</button>
      </div>
    </div>
  </div>
  <div class="sheet" id="fin" hidden>
    <div class="carta" role="dialog" aria-modal="true" aria-labelledby="tFin">
      <h2 id="tFin">TABLERO LIMPIO</h2>
      <div class="grande" id="fTiempo"></div>
      <div class="linea" id="fLinea"></div>
      <div class="sello" id="fSello" hidden>NUEVO RÉCORD</div>
      <div class="palos">
        <button class="palo main" type="button" data-act="otra">OTRA VEZ</button>
        <button class="palo" type="button" data-act="estuche">OTRO TABLERO</button>
      </div>
    </div>
  </div>
</div>
<div id="rotate">Girá el teléfono para jugar en horizontal</div>

<script src="../comun/pantalla.js"></script>
<script src="fichas.js"></script>
<script src="tableros.js"></script>
<script src="estado.js"></script>
<script src="../comun/registro.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const Est = window.Estado, T = window.Tableros, F = window.Fichas;
  const fx = (n, a, gap) => App.sonido.fx(n, a, gap);
  const Q = new URLSearchParams(location.search);
  const TAB = T.porId(Q.get('tablero')), P = TAB.P;
  const fmtT = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtN = n => n.toLocaleString('es-AR');
  document.body.insertAdjacentHTML('afterbegin', F.defs());

  // ============================================================ stage fit: 1em = 1rem = one design unit
  const stage = $('stage');
  function fit() {
    const vv = window.visualViewport;
    const w = document.documentElement.clientWidth || innerWidth, h = (vv && vv.height) || innerHeight;
    const s = Math.min(w / 915, h / 412);
    stage.style.fontSize = s + 'px';
    document.documentElement.style.fontSize = s + 'px';
    stage.style.left = ((w - 915 * s) / 2) + 'px';
    stage.style.top = ((h - 412 * s) / 2) + 'px';
  }
  addEventListener('resize', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  // ============================================================ the board: positions in tile units (36 × 48)
  const W = F.W, H = F.H, SX = 5, SY = 6;
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  P.forEach(t => { const x = t.x * W / 2 - t.z * SX, y = t.y * H / 2 - t.z * SY; minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x + W + 8); maxY = Math.max(maxY, y + H + 9); });
  const bw = maxX - minX, bh = maxY - minY, zmax = Math.max(...P.map(t => t.z));
  const capa = $('capa');
  const sc = Math.min(614 / bw, 396 / bh);
  capa.style.width = bw + 'em'; capa.style.height = bh + 'em';
  capa.style.transform = `translate(${(614 - bw * sc) / 2}em, ${(396 - bh * sc) / 2}em) scale(${sc})`;
  const posX = i => P[i].x * W / 2 - P[i].z * SX - minX, posY = i => P[i].y * H / 2 - P[i].z * SY - minY;

  // ============================================================ the match
  const G = { cara: {}, occ: new Set(), libre: {}, sel: -1, puntos: 0, cadena: 0, ultimoPar: 0, undo: [], t: 0, empezado: false, fin: false, ocupado: false };
  let el = [], pausado = false;
  function setCara(i) { el[i].querySelector('use').setAttribute('href', '#f-' + G.cara[i]); el[i].setAttribute('aria-label', F.FACE[G.cara[i]].name); }

  // the play log (comun/registro.js): each deal, how it went and what helped (undo, hints, shuffles)
  const Reg = window.Registro || { anotar() {}, borrador() {} };
  let reg = null;
  const regBorrador = () => { if (reg) Reg.borrador('mahjong', Object.assign({}, reg, { segundos: Math.round(G.t), puntos: G.puntos, quedan: G.occ.size })); };
  function regCerrar(resultado) {
    if (!reg) return;
    Reg.anotar('mahjong', Object.assign(reg, { resultado, segundos: Math.round(G.t), puntos: G.puntos, quedan: G.occ.size }));
    reg = null;
  }
  addEventListener('pagehide', () => regCerrar('abandono'));

  function repartir() {
    regCerrar('sin salida');   // only open here when the shuffle found no way out and deals again
    reg = { ev: 'partida', tablero: TAB.id, fichas: P.length, pares: [], deshacer: 0, pistas: 0, barajadas: 0, barajadasSolas: 0, pausas: 0 };
    Object.assign(G, { cara: T.nuevo(TAB), occ: new Set(P.map((_, i) => i)), sel: -1, puntos: 0, cadena: 0, ultimoPar: 0, undo: [], t: 0, empezado: false, fin: false, ocupado: false });
    capa.innerHTML = P.map((t, i) => `<button class="ficha entra" type="button" data-i="${i}" style="left:${posX(i)}em;top:${posY(i)}em;--d:${Math.min(i * 6, 700)}ms"><svg class="f" viewBox="0 0 42 56" aria-hidden="true">${F.cuerpo(G.cara[i])}</svg></button>`).join('');
    el = [...capa.children];
    el.forEach((e, i) => { e.setAttribute('aria-label', F.FACE[G.cara[i]].name); e.addEventListener('animationend', () => e.classList.remove('entra', 'vuelve', 'nop', 'gira'), { once: false }); });
    marcarLibres(); hud(); fx('reparte');
    Est.empezado(TAB.id);
  }
  function marcarLibres() {
    for (const i of G.occ) {
      G.libre[i] = T.libre(i, G.occ, P);
      const capa = zmax ? (zmax - P[i].z) / zmax : 0;
      el[i].style.setProperty('--a', (capa * .24 + (G.libre[i] ? 0 : .18)).toFixed(2));
      el[i].classList.toggle('libre', G.libre[i]);
    }
  }
  function deseleccionar() { if (G.sel >= 0) el[G.sel].classList.remove('sel'); G.sel = -1; }
  function reanimar(e, cls) { e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); }
  function empezar() { if (G.empezado) return; G.empezado = true; ultimoTic = performance.now(); pedirPantalla(); }

  capa.addEventListener('click', e => {
    const b = e.target.closest('.ficha'); if (!b || G.ocupado || pausado || G.fin) return;
    const i = +b.dataset.i; if (!G.occ.has(i)) return;
    empezar();
    if (!G.libre[i]) { fx('mal'); reanimar(b, 'nop'); return; }
    if (G.sel === i) { deseleccionar(); fx('suelta'); return; }
    if (G.sel >= 0 && F.FACE[G.cara[G.sel]].key === F.FACE[G.cara[i]].key) { juntar(G.sel, i); return; }
    deseleccionar(); G.sel = i; b.classList.add('sel'); fx('toc');
  });

  function juntar(a, b) {
    deseleccionar();
    const now = performance.now();
    G.cadena = (G.ultimoPar && now - G.ultimoPar <= 5000) ? Math.min(5, G.cadena + 1) : 1;
    G.ultimoPar = now;
    const pts = 10 * G.cadena;
    G.puntos += pts; G.undo.push({ a, b, pts });
    for (const i of [a, b]) {
      G.occ.delete(i);
      const e = el[i]; e.classList.remove('pista', 'nop', 'vuelve', 'entra'); e.classList.add('sale');
      clearTimeout(e._tm); e._tm = setTimeout(() => { e.hidden = true; }, 240);
    }
    flota((posX(a) + posX(b)) / 2 + W / 2, Math.min(posY(a), posY(b)) - 6, G.cadena > 1 ? `+${pts} · ×${G.cadena}` : `+${pts}`);
    fx('par', G.cadena);
    marcarLibres(); hud();
    if (reg) { reg.pares.push(Math.round(G.t * 10) / 10); regBorrador(); }   // when each pair went, in seconds
    if (!G.occ.size) { limpio(); return; }
    if (!T.pares(G.occ, G.cara, P).length) { G.ocupado = true; setTimeout(() => { aviso('No quedan pares libres: se barajan solas', 2600); setTimeout(() => barajar(true), 1000); }, 400); }
  }
  function flota(x, y, texto, grande) {
    const d = document.createElement('div');
    d.className = 'flota' + (grande ? ' grande' : ''); d.textContent = texto;
    d.style.left = x + 'em'; d.style.top = y + 'em';
    capa.appendChild(d); setTimeout(() => d.remove(), 950);
  }
  function barajar(solas) {
    if (reg) { if (solas) reg.barajadasSolas++; else reg.barajadas++; }
    deseleccionar(); G.cadena = 0; G.ultimoPar = 0;
    const asign = T.barajar(G.occ, G.cara, P);
    if (!asign) { aviso('Este reparto no tiene salida: va uno nuevo'); G.ocupado = true; setTimeout(repartir, 1100); return; }
    G.ocupado = true; fx('baraja');
    for (const i of G.occ) { reanimar(el[i], 'gira'); setTimeout(() => { G.cara[i] = asign[i]; setCara(i); }, 170); }
    setTimeout(() => { G.ocupado = false; marcarLibres(); hud(); }, 360);
  }
  function deshacer() {
    if (G.ocupado || G.fin) return;
    const u = G.undo.pop();
    if (!u) { fx('mal'); aviso('No hay jugadas para deshacer'); return; }
    deseleccionar();
    for (const i of [u.a, u.b]) { G.occ.add(i); const e = el[i]; clearTimeout(e._tm); e.hidden = false; e.classList.remove('sale'); reanimar(e, 'vuelve'); }
    G.puntos = Math.max(0, G.puntos - u.pts); G.cadena = 0; G.ultimoPar = 0;
    if (reg) reg.deshacer++;
    marcarLibres(); hud(); fx('deshacer');
  }
  function pista() {
    if (G.ocupado || G.fin) return;
    const pp = T.pares(G.occ, G.cara, P);
    if (!pp.length) { barajar(true); return; }
    empezar(); G.cadena = 0; G.ultimoPar = 0; hud();
    if (reg) reg.pistas++;
    for (const i of T.azar(pp)) { const e = el[i]; reanimar(e, 'pista'); clearTimeout(e._pt); e._pt = setTimeout(() => e.classList.remove('pista'), 2300); }
    fx('pista');
  }
  let avisoTm;
  function aviso(t, ms = 2200) { const a = $('aviso'); a.textContent = t; a.hidden = false; clearTimeout(avisoTm); avisoTm = setTimeout(() => { a.hidden = true; }, ms); }

  // the pad
  function hud() {
    $('nombre').textContent = TAB.nombre;
    $('quedan').textContent = G.occ.size / 2;
    const r = Est.record(TAB.id);
    $('rec').textContent = r.tiempo ? fmtT(r.tiempo) : '—';
    $('pts').textContent = fmtN(G.puntos);
    const vivo = G.cadena > 1 && performance.now() - G.ultimoPar <= 5000;
    $('cadena').hidden = !vivo; if (vivo) $('cadena').textContent = `cadena ×${G.cadena}`;
  }
  let ultimoTic = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (G.empezado && !G.fin && !pausado && !document.hidden) G.t += (now - ultimoTic) / 1000;
    ultimoTic = now;
    $('reloj').textContent = fmtT(G.t);
    if (G.cadena > 1) hud();
  }, 250);

  // a clean board: +100, the card with the time and the records
  function limpio() {
    G.fin = true; G.puntos += 100; G.cadena = 0; hud(); soltarPantalla();
    G.t = Math.max(1, Math.round(G.t));   // the clock, the card and the record show the same second
    const rec = Est.limpio(TAB.id, G.t, G.puntos);
    regCerrar('limpio');
    flota(bw / 2, bh / 2 - 20, 'Tablero limpio +100', true);
    fx('limpio');
    setTimeout(() => {
      const r = Est.record(TAB.id);
      $('fTiempo').textContent = fmtT(G.t);
      $('fLinea').innerHTML = `${TAB.nombre} · <b>${fmtN(G.puntos)}</b> puntos<br>récord <b>${fmtT(r.tiempo)}</b>`;
      $('fSello').hidden = !rec.tiempo;
      if (rec.tiempo) fx('record');
      $('fin').hidden = false;
    }, 1300);
  }

  // ============================================================ menus and «atrás»
  // «Atrás» in a match: the first one opens the pause (the match keeps one step of history for it); from the pause
  // or from the end of a board, the next one goes back to the case. As in Fogonazo.
  const menu = $('menu'), fin = $('fin');
  let pausaGastada = false;
  function pausar(gastada) {
    if (G.fin || !menu.hidden) return;
    pausado = true; pausaGastada = gastada; deseleccionar();
    if (reg) reg.pausas++;
    $('pResumen').innerHTML = `${TAB.nombre} · <b>${fmtT(G.t)}</b> · <b>${fmtN(G.puntos)}</b> puntos`;
    menu.hidden = false; App.sonido.duck(true);
  }
  function seguir() { menu.hidden = true; pausado = false; ultimoTic = performance.now(); App.sonido.duck(false); if (pausaGastada) App.abrir(); pausaGastada = false; }
  window.Pantalla.atras = () => {
    if (!fin.hidden || !menu.hidden) { App.sonido.duck(false); App.volver(); return; }
    pausar(true);
  };
  $('pausa').addEventListener('click', () => { if (G.fin) return; fx('boton'); if (App.extra > 0) App.volver(); else pausar(false); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.empezado && !G.fin && menu.hidden) pausar(false); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    fx('boton');
    if ((act === 'otra' || act === 'estuche') && !G.fin) regCerrar('abandono');
    if (act === 'seguir') seguir();
    if (act === 'otra') {
      const devolver = !menu.hidden && pausaGastada;
      menu.hidden = true; fin.hidden = true; pausado = false; pausaGastada = false; App.sonido.duck(false);
      if (devolver) App.abrir();
      repartir();
    }
    if (act === 'estuche') { App.sonido.duck(false); App.volver(App.extra + 1); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) seguir(); });
  $('volver').addEventListener('click', () => { fx('boton'); if (!G.fin) regCerrar('abandono'); App.sonido.duck(false); App.volver(App.extra + 1); });
  $('b-deshacer').addEventListener('click', () => deshacer());
  $('b-pista').addEventListener('click', () => pista());
  $('b-barajar').addEventListener('click', () => { if (!G.ocupado && !G.fin) { empezar(); barajar(); } });

  // the screen stays on while playing
  let wake = null;
  async function pedirPantalla() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; } }
  function soltarPantalla() { try { wake && wake.release(); } catch (e) {} wake = null; }
  addEventListener('pagehide', soltarPantalla);

  // for the tools (herramientas/capturas.js): the state, play a free pair, finish the board
  window.__mahjong = {
    state: () => ({ tablero: TAB.id, quedan: G.occ.size, puntos: G.puntos, t: G.t, fin: G.fin, pausado, sel: G.sel }),
    parLibre: () => T.pares(G.occ, G.cara, P)[0] || null,
    jugarPar() { const pp = T.pares(G.occ, G.cara, P); if (pp.length) juntar(...pp[0]); return pp.length > 0; },
    // with the deal's own way out; after some moves, whatever pairs are free
    limpiar() {
      const salida = G.cara.salida || [];
      for (const [a, b] of salida) if (G.occ.has(a) && G.occ.has(b) && T.libre(a, G.occ, P) && T.libre(b, G.occ, P)) juntar(a, b);
      while (G.occ.size && !G.fin) { const pp = T.pares(G.occ, G.cara, P); if (!pp.length) break; juntar(...pp[0]); }
    },
  };
  document.fonts.ready.then(repartir);
})();
</script>
</body>
</html>
