<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- La colección de minijuegos: la página que contiene a la sala y a los juegos. Ver comun/app.js y docs/coleccion.md. -->
<title>Minijuegos</title>
<meta name="description" content="Una colección de minijuegos para el celular, en un living de los 70.">
<meta name="theme-color" content="#120c0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<style>
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url(comun/fuentes/ibm-plex-mono-latin-600-normal.woff2) format('woff2'); }
html, body { margin: 0; height: 100%; background: #120c0a; overflow: hidden; }
.pantalla { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #120c0a; }
#velo { position: fixed; inset: 0; background: #0a0605; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
#velo.on { opacity: 1; pointer-events: auto; }
/* «Actualizando», while a new version comes in: small, in the middle, lit like the green display of the settings */
#aviso { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font: 600 13px/1 "IBM Plex Mono", monospace;
  letter-spacing: .18em; color: #7dffd0; text-shadow: 0 0 7px rgba(125, 255, 208, .55); animation: latido 1.4s ease-in-out infinite; }
#aviso[hidden] { display: none; }
@keyframes latido { 50% { opacity: .45; } }
</style>
</head>
<body>
<div id="velo" class="on"><p id="aviso" role="status" hidden>ACTUALIZANDO</p></div>
<script src="comun/sonido.js"></script>
<script src="comun/app.js"></script>
<script src="comun/registro.js"></script>
</body>
</html>
