<title>Fogonazo</title>
<style>
/* ================================================================================================
   GUÍA DE ESTILO DE FOGONAZO
   Las reglas vigentes de interfaz, dibujos, sonido y música. Por qué se decidió cada una y qué se
   descartó está en docs/decisiones.md; las reglas del juego, en docs/manifiesto.md.

   Metáfora
   - Banco de trabajo de electrónica: tapete antiestático gris azulado con grilla de fondo, la placa
     PCB verde en el centro e instrumentos en el tablero. Movimientos en un display de 7 segmentos
     rojo, puntos en un display fluorescente (VFD) verde agua y el avance de estrellas en un vúmetro
     de LEDs. Tema oscuro único, a propósito: no hay modo claro.
   - Pensado para el celular, en vertical.
   - Funciona sin conexión: todo queda guardado en el teléfono (sw.js), también las tipografías
     (herramientas/fuentes.js).

   Dos consolas: 8 bits (por defecto, no se saca) y 16 bits
   - El selector «Gráficos: 8 bits / 16 bits» está en los Ajustes del mapa y en la pausa, y se guarda.
     Cambia todo: dibujos, interfaz, tipografía, música y efectos. Todo cambio se resuelve en las dos.
   - Dibujos: 8 bits, 16×16 con contorno negro y colores planos (sprites.js); 16 bits, 32×32 con luz
     desde arriba a la izquierda, brillo, tramado y contorno de color (sprites16.js).
   - Placa: 8 bits, celdas planas; 16 bits, degradé, pistas de cobre en las calles y vías doradas.
   - Títulos: 8 bits, Silkscreen; 16 bits, Jersey 25 con relleno metálico (dorado el logo, plateado
     el resto). Textos y botones: 8 bits, Pixelify Sans y Silkscreen; 16 bits, Jersey 15.
   - Paneles y menús: 8 bits, planos con borde; 16 bits, bisel, tornillos en las esquinas y vidrio
     sobre los displays. Botones: cobre plano en 8 bits, cromados con relieve en 16.
   - Mapa: placas verdes con pads de cobre; en 16 bits, con textura de pistas y pads con volumen,
     plateados al completarlos.
   - Transiciones: ninguna en 8 bits; en 16, mosaico de medio segundo al empezar cada nivel.
   - El cartel de fin de nivel lleva siempre su panel de fondo, también en 16 bits.

   Detalles
   - El contador de estrellas va en una fila propia bajo el título, con su barra de avance.
   - Sin ligaduras tipográficas (Pixelify Sans une «fi» y «fl» en un signo que parece una «A»).
   - «★», «▶» y «✓» son dibujos pixelados propios (las fuentes no los traen).
   - Ícono del juego: el LED de 16 bits con un destello detrás, sobre la placa verde.

   Sonido y música (audio.js): todo se sintetiza en el navegador, sin archivos de audio
   - Tres temas, cada uno con dos arreglos de las mismas notas: Placa (el original; niveles por
     movimientos; la menor, Am F C G, 104 ppm), Taller (mapa; do mayor, C G Am F, arpegio a
     corcheas, 92 ppm) y Urgente (contrarreloj; la menor con final en mi mayor, Am F Dm E, 144 ppm).
   - 8 bits: los instrumentos del tema original (bajo cuadrado, arpegio triangular, hi-hats de
     ruido y melodía cuadrada, que entra cada dos vueltas en Placa y Taller).
   - 16 bits: FM tipo Genesis (bajo slap, melodía tipo bronce, arpegio que alterna entre parlantes,
     eco corto), pasada por una etapa que satura y baja la resolución. Va al 60 % del bus de música.
   - Sonido de línea: el original en 8 bits; «Bip» (dos pulsos FM cortos) en 16.
   - Los efectos de 16 bits están nivelados con los de 8. La música baja al terminar un nivel para
     que se escuche la fanfarria. Volúmenes por defecto: efectos 70, música 35; «Silenciar todo».

   Versión instalable (0.1.0)
   - Tarjeta «Instalá Fogonazo en tu teléfono», solo en el navegador (no desde el ícono ni en la vista previa
     de claude.ai), arriba del bloque del nivel actual: ícono, título, «Queda entre tus apps y funciona sin
     conexión.» e «Instalar». Abre el cuadro de Chrome si ya está disponible; si no, la ventana «Instalar
     Fogonazo» con los dos pasos del menú ⋮ (o los de Safari en iPhone). En Samsung Internet, la ventana
     ofrece «Abrir en Chrome». Instalado, la tarjeta pasa a «Listo», con borde verde.
   - Versión: última fila de Ajustes antes de «Listo», con su número y su fecha. Al día, «Buscar»; con una
     nueva, LED verde «Hay una versión nueva» y «Actualizar» (cobre, el principal), que reabre el juego y avisa
     «Listo». Mientras haya una nueva, un LED verde en el engranaje del mapa. Verde: el color de lo nuevo.
   - Avisos breves (toast) abajo, en un panel como los del tablero.
   - En 16 bits, Jersey no tiene negrita: lo destacado va en blanco, sin negrita sintética.

   Textos
   - Amenos, en voseo rioplatense, sin errores ni redundancias y técnicamente correctos.
   ================================================================================================ */
/* Tipografías locales (herramientas/fuentes.js), para que el juego funcione sin conexión.
   La vista previa de claude.ai las lleva adentro del archivo (herramientas/vista_previa.js). */
@font-face { font-family: 'Silkscreen'; font-weight: 400; font-display: swap; src: url(fuentes/silkscreen-400.woff2) format('woff2'); }
@font-face { font-family: 'Silkscreen'; font-weight: 700; font-display: swap; src: url(fuentes/silkscreen-700.woff2) format('woff2'); }
@font-face { font-family: 'Pixelify Sans'; font-weight: 400; font-display: swap; src: url(fuentes/pixelify-sans-400.woff2) format('woff2'); }
@font-face { font-family: 'Pixelify Sans'; font-weight: 600; font-display: swap; src: url(fuentes/pixelify-sans-600.woff2) format('woff2'); }
@font-face { font-family: 'Jersey 15'; font-weight: 400; font-display: swap; src: url(fuentes/jersey-15-400.woff2) format('woff2'); }
@font-face { font-family: 'Jersey 25'; font-weight: 400; font-display: swap; src: url(fuentes/jersey-25-400.woff2) format('woff2'); }
:root {
  --mat: #1a252d;
  --mat-line: #22303a;
  --panel: #0e1519;
  --panel-2: #141e24;
  --edge: #2b3a44;
  --pcb: #0f4a31;
  --pcb-dark: #0a3423;
  --silk: #edf3ef;
  --muted: #8ea2ab;
  --copper: #e08a3c;
  --copper-hi: #f7b77c;
  --copper-lo: #9c5520;
  --solder: #c9d1d9;
  --led: #ff3d2e;
  --led-off: #3a1714;
  --vfd: #4ef2c9;
  --vfd-off: #12332c;
  --amber: #ffbf2e;
  --ok: #3ee07a;
  --font-display: 'Silkscreen', 'Courier New', monospace;
  --font-ui: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--silk);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
}
button, input, h1, h2, h3, p, span, b, label, output { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0, "dlig" 0; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
#app { height: 100%; max-width: 520px; margin: 0 auto; position: relative; user-select: none; -webkit-user-select: none; }
.screen { height: 100%; display: flex; flex-direction: column; }
.pixel-icon { image-rendering: pixelated; display: block; }

/* ---------- botones */
.btn {
  font-family: var(--font-ui); font-size: 15px; letter-spacing: .04em; text-transform: uppercase;
  border: 0; border-radius: 4px; padding: 12px 16px; min-height: 46px; cursor: pointer;
  background: var(--copper); color: #2a1406;
  box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -4px 0 var(--copper-lo), 0 2px 0 #000a;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -2px 0 var(--copper-lo); }
.btn.ghost { background: var(--panel-2); color: var(--silk); box-shadow: inset 0 0 0 2px var(--edge), 0 2px 0 #000a; }
.btn.ghost:active { box-shadow: inset 0 0 0 2px var(--edge); }
.btn.danger { background: #c0392b; color: #fff; box-shadow: inset 0 2px 0 #e86a5c, inset 0 -4px 0 #7d1d13; }
.btn:focus-visible, .icon-btn:focus-visible, .node:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 4px; border: 0; cursor: pointer; flex: none;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge); display: grid; place-items: center; color: var(--silk);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--panel-2); }

/* ---------- mapa */
#scr-map { overflow-y: auto; padding: 14px 16px 28px; gap: 14px; }
.map-head { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: min(30px, 8.2vw); margin: 0; letter-spacing: .02em; line-height: 1; text-shadow: 3px 3px 0 #000; white-space: nowrap; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.prog { flex: 1; min-width: 0; display: flex; gap: 2px; height: 12px; }
.prog i { flex: 1; border-radius: 1px; background: #16241c; }
.prog i.lit { background: var(--amber); box-shadow: 0 0 4px #ffbf2e88; }
.led-dot { width: 12px; height: 12px; border-radius: 2px; background: var(--led); box-shadow: 0 0 10px var(--led); animation: blink 1.6s steps(1) infinite; flex: none; }
@keyframes blink { 50% { background: var(--led-off); box-shadow: none; } }
.star-total { font-family: var(--font-ui); font-size: 14px; display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 6px 10px; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--edge); height: 36px; flex: none; }
.tagline { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
.block {
  background: var(--pcb); border-radius: 8px; padding: 12px 12px 14px; position: relative;
  box-shadow: inset 0 0 0 2px var(--pcb-dark), 0 3px 0 #0006;
  background-image: radial-gradient(circle at 10px 10px, #c9a24a 0 3px, var(--pcb-dark) 3px 4.5px, transparent 5px), radial-gradient(circle at calc(100% - 10px) 10px, #c9a24a 0 3px, var(--pcb-dark) 3px 4.5px, transparent 5px);
}
.block.locked { filter: saturate(.35) brightness(.75); }
.block-head { display: flex; align-items: baseline; gap: 8px; padding: 0 16px; flex-wrap: wrap; }
.block-head .ref { font-family: var(--font-ui); font-size: 11px; color: #bfe5cf; opacity: .8; }
.block-head h2 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.block-head .desc { font-size: 14px; color: #a9d6bd; }
.nodes { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; }
.nodes::before { content: ''; position: absolute; left: 10%; right: 10%; top: 25px; height: 6px; background: var(--copper-lo); border-radius: 3px; box-shadow: inset 0 2px 0 #c7783a; }
.node {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: 0; padding: 0; cursor: pointer;
}
.node .pad {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
  background: radial-gradient(circle, #0b2118 0 15px, var(--copper) 16px 21px, var(--copper-lo) 22px 25px, transparent 26px);
  font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--silk);
}
.node.done .pad { background: radial-gradient(circle, #0b2118 0 15px, #dfe5ea 16px 19px, #9aa4ae 20px 25px, transparent 26px); }
.node.locked .pad { background: radial-gradient(circle, #0b2a1d 0 15px, #2f5a45 16px 25px, transparent 26px); color: #5f8a75; }
.node.current .pad::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 3px var(--amber), 0 0 16px var(--amber); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.node .badge { position: absolute; top: -4px; right: calc(50% - 32px); z-index: 2; width: 20px; height: 20px; border-radius: 3px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--amber); display: grid; place-items: center; }
.node .badge svg { width: 14px; height: 14px; }
.node .stars { display: flex; gap: 2px; height: 12px; }
.node .stars svg { width: 12px; height: 12px; }
.help-link { align-self: center; }

/* ---------- juego */
#scr-game { padding: 8px 12px 10px; gap: 8px; }
.game-head { display: flex; align-items: center; gap: 10px; }
.lvl-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.lvl-title .num { font-family: var(--font-ui); font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.lvl-title .name { font-family: var(--font-display); font-size: 16px; font-weight: 700; text-transform: uppercase; text-align: center; text-wrap: balance; max-width: 100%; line-height: 1.05; }
.lvl-title .name.long { font-size: 13px; }
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: stretch; }
.meter { background: var(--panel); border-radius: 5px; padding: 5px 8px 6px; box-shadow: inset 0 0 0 2px var(--edge), inset 0 3px 8px #000c; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.meter label { font-family: var(--font-ui); font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; gap: 2px; height: 30px; }
.seg svg { height: 100%; width: auto; overflow: visible; }
.seg .on { fill: var(--led); filter: drop-shadow(0 0 3px #ff3d2e99); }
.seg .off { fill: var(--led-off); }
.seg.vfd .on { fill: var(--vfd); filter: drop-shadow(0 0 3px #4ef2c999); }
.seg.vfd .off { fill: var(--vfd-off); }
.seg.warn .on { animation: blink .5s steps(1) infinite; }
.vu-wrap { background: var(--panel); border-radius: 5px; padding: 6px 8px; box-shadow: inset 0 0 0 2px var(--edge), inset 0 3px 8px #000c; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.vu-stars { position: relative; height: 14px; }
.vu-stars svg { position: absolute; top: 0; width: 14px; height: 14px; transform: translateX(-50%); }
.vu { display: flex; gap: 2px; height: 14px; }
.vu i { flex: 1; border-radius: 1px; background: #16241c; }
.vu i.y { background: #2c2610; }
.vu i.r { background: #2d1210; }
.vu i.lit { background: var(--ok); box-shadow: 0 0 5px #3ee07aaa; }
.vu i.y.lit { background: var(--amber); box-shadow: 0 0 5px #ffbf2eaa; }
.vu i.r.lit { background: var(--led); box-shadow: 0 0 5px #ff3d2eaa; }
.goals { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 44px; }
.goal { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 5px; padding: 4px 10px 4px 6px; box-shadow: inset 0 0 0 2px var(--edge); }
.goal canvas { width: 32px; height: 32px; }
.goal .cnt { font-family: var(--font-display); font-size: 18px; font-weight: 700; min-width: 2ch; text-align: right; }
.goal .lbl { font-size: 13px; color: var(--muted); }
.goal.done { box-shadow: inset 0 0 0 2px var(--ok); }
.goal.done .cnt { color: var(--ok); }
.goal.bump { animation: bump .25s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.board-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; padding-top: 2px; }
.board-frame { position: relative; padding: 7px; border-radius: 9px; background: var(--pcb-dark); box-shadow: 0 0 0 2px #06231a, 0 6px 0 #0008; }
.board-frame::before, .board-frame::after { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #c9a24a; box-shadow: 0 0 0 2px #06231a; top: -2px; }
.board-frame::before { left: -2px; }
.board-frame::after { right: -2px; }
#board { display: block; touch-action: none; border-radius: 3px; image-rendering: pixelated; }
.banner {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
  font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; text-align: center;
  background: var(--panel); padding: 12px 18px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--amber), 0 6px 0 #0009;
  color: var(--amber); max-width: 90%; text-wrap: balance; animation: bannerIn .25s ease-out;
}
@keyframes bannerIn { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
.tip-strip { font-size: 14px; color: var(--muted); text-align: center; min-height: 18px; line-height: 1.25; }

/* ---------- modales */
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #050a0dcc; }
.card {
  width: 100%; max-width: 380px; max-height: calc(100% - 8px); overflow-y: auto; border-radius: 8px; padding: 18px 16px 16px;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge), 0 10px 0 #000a; display: flex; flex-direction: column; gap: 12px;
  animation: cardIn .2s ease-out;
}
@keyframes cardIn { from { transform: translateY(16px); opacity: 0; } }
.card .eyebrow { font-family: var(--font-ui); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; text-transform: uppercase; text-wrap: balance; line-height: 1.1; }
.card p { margin: 0; line-height: 1.4; color: #c9d6dc; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.card .row > .btn { flex: 1 1 120px; }
.card .stack { display: flex; flex-direction: column; gap: 8px; }
.spec { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 5px; padding: 8px 10px; }
.spec .k { font-family: var(--font-ui); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.spec .v { font-family: var(--font-ui); font-size: 16px; }
.order { display: flex; flex-direction: column; gap: 6px; }
.order-item { display: flex; align-items: center; gap: 10px; }
.order-item canvas { width: 36px; height: 36px; flex: none; }
.newbox { display: flex; gap: 12px; align-items: center; background: #2a2208; border-radius: 6px; padding: 10px 12px; box-shadow: inset 0 0 0 2px #6b5410; }
.newbox canvas { width: 48px; height: 48px; flex: none; }
.newbox .t { font-size: 15px; line-height: 1.35; color: #f3e6c0; }
.newbox .t b { font-family: var(--font-ui); font-size: 12px; color: var(--amber); display: block; margin-bottom: 2px; letter-spacing: .06em; }
.bigstars { display: flex; justify-content: center; gap: 10px; padding: 4px 0; }
.bigstars svg { width: 52px; height: 52px; transition: transform .2s; }
.bigstars svg.pop { animation: starPop .35s ease-out; }
@keyframes starPop { 0% { transform: scale(.3); } 70% { transform: scale(1.25); } }
.score-line { display: flex; justify-content: space-between; font-family: var(--font-ui); font-size: 15px; }
.score-line .rec { color: var(--amber); }
.fader { display: grid; grid-template-columns: 74px 1fr 42px; gap: 10px; align-items: center; }
.fader label { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.fader output { font-family: var(--font-ui); font-size: 13px; text-align: right; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #05090b; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--edge); }
input[type=range]::-moz-range-track { height: 6px; background: #05090b; border-radius: 3px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 30px; margin-top: -12px; border-radius: 3px; background: var(--copper); box-shadow: inset 0 -4px 0 var(--copper-lo), inset 0 2px 0 var(--copper-hi); }
input[type=range]::-moz-range-thumb { width: 18px; height: 30px; border-radius: 3px; border: 0; background: var(--copper); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel-2); border-radius: 5px; padding: 8px 10px; cursor: pointer; border: 0; width: 100%; text-align: left; }
.toggle .lbl { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.toggle .sw { width: 46px; height: 24px; border-radius: 3px; background: #05090b; box-shadow: inset 0 0 0 2px var(--edge); position: relative; flex: none; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 2px; background: #56636b; transition: left .15s; }
.stylepick { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: center; background: var(--panel-2); border-radius: 5px; padding: 6px 8px; }
.stylepick .lbl { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-right: 4px; }
.stylepick button { font-family: var(--font-ui); font-size: 13px; border: 0; border-radius: 3px; min-height: 40px; cursor: pointer; background: #05090b; color: var(--muted); box-shadow: inset 0 0 0 2px var(--edge); }
.stylepick button[aria-pressed=true] { background: var(--copper); color: #2a1406; box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -3px 0 var(--copper-lo); }

.legend { display: flex; flex-direction: column; gap: 8px; }

/* =====================================================================

   botones cromados, títulos con relleno metálico, vidrio sobre los displays.

html[data-art="16"] {

html[data-art="16"] .icon-btn { color: #e6edf2; }

    var(--screw) 3px calc(100% - 3px) / 12px 12px no-repeat, var(--screw) calc(100% - 3px) calc(100% - 3px) / 12px 12px no-repeat,
    linear-gradient(180deg, #24343f 0%, #18232b 60%, #121b21 100%);
  box-shadow: inset 0 1px 0 #5a7182, inset 0 0 0 3px #0c1216, inset 0 0 0 4px #33444f, 0 0 0 2px #05080a, 0 0 0 4px #4c5f6c, 0 0 0 6px #0b1013, 0 10px 0 4px #000a;
}
html[data-art="16"] .card p, html[data-art="16"] .newbox .t { font-size: 19px; line-height: 1.25; }
html[data-art="16"] .spec .k, html[data-art="16"] .fader label, html[data-art="16"] .toggle .lbl, html[data-art="16"] .stylepick .lbl { font-size: 17px; }
html[data-art="16"] .spec .v, html[data-art="16"] .score-line { font-size: 22px; }

html[data-art="16"] .newbox { border-radius: 8px; background: linear-gradient(180deg, #3a2f0c, #241d07); box-shadow: inset 0 1px 0 #8a7228, 0 0 0 2px #120e03, 0 0 0 3px #6b5410; }
html[data-art="16"] .newbox .t b { font-size: 17px; }

html[data-art="16"] .legend h3 { font-size: 20px; }
html[data-art="16"] .legend .it, html[data-art="16"] .parts .p { font-size: 18px; }
html[data-art="16"] input[type=range]::-webkit-slider-thumb { width: 20px; height: 32px; margin-top: -13px; border-radius: 4px; background: linear-gradient(90deg, #8a4012, #f5ad62 35%, #ffe0b4 50%, #dc7c31 65%, #86400f); box-shadow: 0 0 0 2px #2a1004; }

    var(--screw) 3px 3px / 12px 12px no-repeat, var(--screw) calc(100% - 3px) 3px / 12px 12px no-repeat,

    linear-gradient(180deg, #24343f 0%, #18232b 60%, #121b21 100%);
  box-shadow: inset 0 1px 0 #5a7182, inset 0 0 0 3px #0c1216, inset 0 0 0 4px #6b5410, 0 0 0 2px #05080a, 0 0 0 4px #c9a24a, 0 0 0 6px #0b1013, 0 8px 0 4px #000a;
}
html[data-art="16"] .banner .bt {

  filter: drop-shadow(2px 0 0 #2a1004) drop-shadow(-2px 0 0 #2a1004) drop-shadow(0 2px 0 #2a1004) drop-shadow(0 -2px 0 #2a1004) drop-shadow(2px 3px 0 #000);
}
/* mapa: placas con pistas y vías */
html[data-art="16"] .block {
  border-radius: 10px;
  background:
    radial-gradient(circle at 11px 11px, #ffe7a3 0 2px, #c9a24a 2.5px 3.5px, #3a2c0c 4px 5px, transparent 5.5px),

    var(--pcb-tex, none),
    linear-gradient(180deg, #17603f, #0d4429);

  .led-dot, .node.current .pad::after, .seg.warn .on { animation: none; }

/* ---------------- versión instalable: tarjeta «Instalar», ventana de instalación, versión y avisos */
.inst {
  display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge), 0 3px 0 #0006;
}
.inst-ic { width: 46px; height: 46px; border-radius: 10px; flex: none; image-rendering: pixelated; box-shadow: 0 0 0 2px #05090b; }
.inst-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.inst-t b { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: 1.3; }
.inst-t small { font-size: 13px; line-height: 1.3; color: var(--muted); }
.inst.ok { box-shadow: inset 0 0 0 2px #1d6b3e, 0 3px 0 #0006; }
.inst-tick { width: 46px; height: 46px; border-radius: 10px; flex: none; display: grid; place-items: center; background: #0f3a22; box-shadow: inset 0 0 0 2px #1d6b3e; color: var(--ok); }
.inst-tick svg { width: 22px; height: 22px; }
.btn.small { min-height: 40px; padding: 8px 10px; font-size: 12px; flex: none; }
.inst-head { display: flex; align-items: center; gap: 12px; }
.pasos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

.pasos .n { font-family: var(--font-ui); font-size: 13px; width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 4px; background: var(--copper); color: #2a1406; box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -3px 0 var(--copper-lo); }
.tecla { display: inline-grid; place-items: center; width: 24px; height: 24px; vertical-align: -6px; border-radius: 4px; background: #05090b; box-shadow: inset 0 0 0 2px var(--edge); color: var(--silk); }

.verrow { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 5px; padding: 8px 10px; }
.verrow .vt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.verrow b { font-family: var(--font-ui); font-size: 12px; font-weight: 400; text-transform: uppercase; letter-spacing: .06em; }
.verrow small { font-size: 13px; line-height: 1.3; color: var(--muted); }
.ver-new { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ok); }
.led-g { width: 10px; height: 10px; border-radius: 2px; flex: none; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
#btnSettings { position: relative; }
.gear-led { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 2px; background: var(--ok); box-shadow: 0 0 8px var(--ok), 0 0 0 2px var(--panel); }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  width: max-content; max-width: min(340px, calc(100% - 32px)); padding: 10px 14px; border-radius: 6px; text-align: center;
  background: var(--panel); color: var(--silk); font-size: 15px; line-height: 1.35;
  box-shadow: inset 0 0 0 2px var(--edge), 0 6px 0 #0009; animation: cardIn .2s ease-out;
}
html[data-art="16"] .inst {
  border-radius: 10px; padding: 12px 14px;
  background: var(--screw) 3px 3px / 12px 12px no-repeat, var(--screw) calc(100% - 3px) 3px / 12px 12px no-repeat,
    var(--screw) 3px calc(100% - 3px) / 12px 12px no-repeat, var(--screw) calc(100% - 3px) calc(100% - 3px) / 12px 12px no-repeat,
    linear-gradient(180deg, #24343f 0%, #18232b 60%, #121b21 100%);
  box-shadow: inset 0 1px 0 #5a7182, inset 0 0 0 3px #0c1216, inset 0 0 0 4px #33444f, 0 0 0 2px #05080a, 0 0 0 4px #4c5f6c, 0 4px 0 4px #000a;
}
html[data-art="16"] .inst.ok { box-shadow: inset 0 1px 0 #5a7182, inset 0 0 0 3px #0c1216, inset 0 0 0 4px #2f8a55, 0 0 0 2px #05080a, 0 0 0 4px #2f8a55, 0 4px 0 4px #000a; }

html[data-art="16"] .btn.small { font-size: 19px; min-height: 42px; padding: 6px 14px; }
html[data-art="16"] .pasos li { font-size: 19px; line-height: 1.25; }
html[data-art="16"] .pasos .n { font-size: 18px; border-radius: 50%; background: linear-gradient(180deg, #ffe0b4 0%, #f5ad62 20%, #dc7c31 54%, #b45a1c 55%, #d0743a 100%); box-shadow: 0 0 0 2px #3a1a06; }
html[data-art="16"] .verrow, html[data-art="16"] .inst-nota, html[data-art="16"] .toast {
  background: linear-gradient(180deg, #24333e 0%, #16212a 55%, #111920 100%); border-radius: 7px;

}

html[data-art="16"] .led-g, html[data-art="16"] .gear-led { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #e2ffe9 0 1.5px, #3ee07a 3px, #127a3a 6px); }

<body>
<div id="app">
  <section id="scr-map" class="screen" aria-label="Mapa de niveles">
    <header class="map-head">
      <div class="brand"><span class="led-dot" aria-hidden="true"></span><h1>Fogonazo</h1></div>
      <button class="icon-btn" id="btnSettings" aria-label="Ajustes"></button>
    </header>
    <div class="progress-row"><div class="star-total" id="starTotal" aria-label="Estrellas"></div><div class="prog" id="prog" aria-hidden="true"></div></div>
    <p class="tagline">Juntá componentes de a tres en la placa. Treinta circuitos, de un LED que titila a una computadora de 8 bits.</p>
    <div id="blocks" style="display:flex;flex-direction:column;gap:14px"></div>
    <button class="btn ghost help-link" id="btnHelp">Cómo se juega</button>
  </section>

  <section id="scr-game" class="screen" hidden aria-label="Nivel">
    <header class="game-head">
      <button class="icon-btn" id="btnBack" aria-label="Volver al mapa"></button>
      <div class="lvl-title"><span class="num" id="lvlNum"></span><span class="name" id="lvlName"></span></div>
      <button class="icon-btn" id="btnPause" aria-label="Pausa y sonido"></button>
    </header>
    <div class="hud">
      <div class="meter"><label id="movesLabel">MOV</label><div class="seg" id="segMoves"></div></div>
      <div class="vu-wrap"><div class="vu-stars" id="vuStars"></div><div class="vu" id="vu"></div></div>
      <div class="meter"><label>PUNTOS</label><div class="seg vfd" id="segScore"></div></div>
    </div>
    <div class="goals" id="goals"></div>
    <div class="board-wrap" id="boardWrap">
      <div class="board-frame" id="boardFrame"><canvas id="board"></canvas></div>
      <div class="banner" id="banner" hidden></div>
      <div class="tip-strip" id="tipStrip"></div>
    </div>
  </section>

  <div class="modal" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
</div>
<script>
/* Chispazo — motor de juego (sin DOM). Corre igual en el navegador y en Node. */
(function (root) {
'use strict';

const W = 8, H = 8, N = W * H;
// Tipos de pieza
const K = { N: 0, LH: 1, LV: 2, BOMB: 3, BAT: 4, TUBE: 5, BURNT: 6 };

function rngFrom(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const X = i => i % W;
const Y = i => (i / W) | 0;
const I = (x, y) => y * W + x;
const inB = (x, y) => x >= 0 && x < W && y >= 0 && y < H;

function matchable(p) { return p !== null && p.k <= 3 && p.c >= 0; }
function isSpecialK(k) { return k >= 1 && k <= 4; }
function fixed(p) { return p !== null && (p.k === K.BURNT || p.lock === 1); }
function swappable(p) { return p !== null && p.k !== K.BURNT && p.lock !== 1; }
function same(p, c) { return p !== null && p.k <= 3 && p.c === c && c >= 0; }

function mk(g, c, k) { return { id: g.nextId++, c, k: k || 0, hp: 0, lock: 0 }; }

// ---------------------------------------------------------------- creación
function createGame(level, seed) {
  const g = {
    level, rng: rngFrom(seed || 1), nextId: 1,
    hole: new Uint8Array(N), pad: new Uint8Array(N), padOrig: new Uint8Array(N),
    p: new Array(N).fill(null),
    colors: level.colors, score: 0,
    mode: level.time ? 'time' : 'moves',
    moves: level.moves || 0, movesUsed: 0, timeLeft: level.time || 0,
    goals: [], tubes: null, preview: false, over: false, won: false, scoreOnly: false,
  };
  const L = level.layout || null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = L ? L[y][x] : '.';
    const i = I(x, y);
    if (ch === 'x') g.hole[i] = 1;
    else if (ch === '1') g.pad[i] = 1;
    else if (ch === '2') g.pad[i] = 2;
    else if (ch === 'b' || ch === 'B') g.p[i] = { id: g.nextId++, c: -1, k: K.BURNT, hp: ch === 'B' ? 2 : 1, lock: 0 };
    else if (ch === 'k' || ch === 'q') { g.p[i] = { id: g.nextId++, c: -2, k: K.N, hp: 0, lock: 1 }; if (ch === 'q') g.pad[i] = 1; }
    g.padOrig[i] = g.pad[i];
  }
  for (const gl of level.goals) {
    const o = { type: gl.type, color: gl.color, need: 0, have: 0 };
    if (gl.type === 'score' || gl.type === 'collect' || gl.type === 'tubes') o.need = gl.n || 0;
    else if (gl.type === 'pads') for (let i = 0; i < N; i++) o.need += g.pad[i];
    else if (gl.type === 'burnt') for (let i = 0; i < N; i++) { const p = g.p[i]; if (p && p.k === K.BURNT) o.need += p.hp; }
    else if (gl.type === 'locks') for (let i = 0; i < N; i++) { const p = g.p[i]; if (p && p.lock) o.need++; }
    g.goals.push(o);
  }
  g.scoreOnly = g.goals.length === 1 && g.goals[0].type === 'score';
  g.hasCollect = g.goals.some(o => o.type === 'collect');
  if (level.tubes) g.tubes = { total: level.tubes.n, maxOn: level.tubes.max || 1, spawned: 0, collected: 0 };
  fillInitial(g);
  return g;
}

function pickColorNoMatch(g, i) {
  const x = X(i), y = Y(i);
  for (let tries = 0; tries < 40; tries++) {
    const c = (g.rng() * g.colors) | 0;
    if (x >= 2 && same(g.p[I(x - 1, y)], c) && same(g.p[I(x - 2, y)], c)) continue;
    if (y >= 2 && same(g.p[I(x, y - 1)], c) && same(g.p[I(x, y - 2)], c)) continue;
    return c;
  }
  return (g.rng() * g.colors) | 0;
}

function fillInitial(g) {
  for (let attempt = 0; attempt < 60; attempt++) {
    for (let i = 0; i < N; i++) {
      if (g.hole[i]) continue;
      const p = g.p[i];
      if (p && p.k === K.BURNT) continue;
      if (p && p.lock) p.c = -2; else g.p[i] = null;
    }
    for (let i = 0; i < N; i++) {
      if (g.hole[i]) continue;
      const p = g.p[i];
      if (p && p.k === K.BURNT) continue;
      if (p && p.lock) p.c = pickColorNoMatch(g, i);
      else g.p[i] = mk(g, pickColorNoMatch(g, i), 0);
    }
    if (g.tubes) {
      // arriba de todo, en columnas con camino libre al zócalo; si no hay ninguna, en cualquiera
      const n = Math.min(g.tubes.maxOn, g.tubes.total);
      const cols = [];
      for (let x = 0; x < W; x++) { const t = colTop(g, x); if (t >= 0 && !fixed(g.p[t])) cols.push(x); }
      for (let k = cols.length - 1; k > 0; k--) { const j = (g.rng() * (k + 1)) | 0; [cols[k], cols[j]] = [cols[j], cols[k]]; }
      const free = cols.filter(x => tubeColFree(g, x));
      let placed = 0;
      for (const x of (free.length ? free : cols)) {
        if (placed >= n) break;
        g.p[colTop(g, x)] = mk(g, -1, K.TUBE); placed++;
      }
      g.tubes.spawned = placed;
    }
    if (findRuns(g).length === 0 && hasValidMove(g)) return;
  }
  if (!hasValidMove(g)) shuffle(g);
}

// ---------------------------------------------------------------- jugadas
function wouldMatch(g, i, c) {
  const x = X(i), y = Y(i);
  let n = 1;
  for (let xx = x - 1; xx >= 0 && same(g.p[I(xx, y)], c); xx--) n++;
  for (let xx = x + 1; xx < W && same(g.p[I(xx, y)], c); xx++) n++;
  if (n >= 3) return true;
  n = 1;
  for (let yy = y - 1; yy >= 0 && same(g.p[I(x, yy)], c); yy--) n++;
  for (let yy = y + 1; yy < H && same(g.p[I(x, yy)], c); yy++) n++;
  return n >= 3;
}

function swapMakesMatch(g, a, b) {
  const pa = g.p[a], pb = g.p[b];
  g.p[a] = pb; g.p[b] = pa;
  const r = (matchable(pb) && wouldMatch(g, a, pb.c)) || (matchable(pa) && wouldMatch(g, b, pa.c));
  g.p[a] = pa; g.p[b] = pb;
  return r;
}

// 0 = inválida, 1 = forma línea, 2 = combinación de especiales.
// Una válvula se intercambia como cualquier pieza: solo si el cambio forma una línea.
function moveKind(g, a, b) {
  const pa = g.p[a], pb = g.p[b];
  if (!swappable(pa) || !swappable(pb)) return 0;
  if (pa.k === K.BAT || pb.k === K.BAT) return (pa.k === K.TUBE || pb.k === K.TUBE) ? 0 : 2;
  if (isSpecialK(pa.k) && isSpecialK(pb.k)) return 2;
  if (swapMakesMatch(g, a, b)) return 1;
  return 0;
}

function listMoves(g) {
  const out = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const a = I(x, y);
    if (x + 1 < W && moveKind(g, a, a + 1)) out.push([a, a + 1]);
    if (y + 1 < H && moveKind(g, a, a + W)) out.push([a, a + W]);
  }
  return out;
}

function hasValidMove(g) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const a = I(x, y);
    if (x + 1 < W && moveKind(g, a, a + 1)) return true;
    if (y + 1 < H && moveKind(g, a, a + W)) return true;
  }
  return false;
}

// ---------------------------------------------------------------- líneas
function findRuns(g) {
  const runs = [];
  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      const p = g.p[I(x, y)];
      if (!matchable(p)) { x++; continue; }
      let x2 = x + 1;
      while (x2 < W && same(g.p[I(x2, y)], p.c)) x2++;
      if (x2 - x >= 3) { const cells = []; for (let k = x; k < x2; k++) cells.push(I(k, y)); runs.push({ dir: 'h', cells, c: p.c }); }
      x = x2;
    }
  }
  for (let x = 0; x < W; x++) {
    let y = 0;
    while (y < H) {
      const p = g.p[I(x, y)];
      if (!matchable(p)) { y++; continue; }
      let y2 = y + 1;
      while (y2 < H && same(g.p[I(x, y2)], p.c)) y2++;
      if (y2 - y >= 3) { const cells = []; for (let k = y; k < y2; k++) cells.push(I(x, k)); runs.push({ dir: 'v', cells, c: p.c }); }
      y = y2;
    }
  }
  return runs;
}

function groupRuns(runs) {
  const parent = runs.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const owner = new Map();
  runs.forEach((r, ri) => {
    for (const c of r.cells) {
      if (owner.has(c)) { const a = find(ri), b = find(owner.get(c)); if (a !== b) parent[a] = b; }
      else owner.set(c, ri);
    }
  });
  const map = new Map();
  runs.forEach((r, ri) => {
    const root = find(ri);
    let gr = map.get(root);
    if (!gr) { gr = { runs: [], cells: new Set(), c: r.c }; map.set(root, gr); }
    gr.runs.push(r);
    for (const c of r.cells) gr.cells.add(c);
  });
  return [...map.values()];
}

function decideSpecial(g, gr, prefer) {
  let maxLen = 0, hasH = false, hasV = false, longest = null;
  for (const r of gr.runs) {
    if (r.cells.length > maxLen) { maxLen = r.cells.length; longest = r; }
    if (r.dir === 'h') hasH = true; else hasV = true;
  }
  let k = -1;
  if (maxLen >= 5) k = K.BAT;
  else if (hasH && hasV) k = K.BOMB;
  else if (maxLen === 4) k = longest.dir === 'h' ? K.LH : K.LV;
  if (k < 0) return null;
  const ok = i => g.p[i] && !g.p[i].lock;
  let pos = -1;
  if (prefer) for (const i of prefer) if (gr.cells.has(i) && ok(i)) { pos = i; break; }
  if (pos < 0 && k === K.BOMB) {
    const hs = new Set();
    for (const r of gr.runs) if (r.dir === 'h') for (const i of r.cells) hs.add(i);
    outer: for (const r of gr.runs) if (r.dir === 'v') for (const i of r.cells) if (hs.has(i) && ok(i)) { pos = i; break outer; }
  }
  if (pos < 0) {
    const cells = longest.cells;
    const mid = cells[(cells.length - 1) >> 1];
    if (ok(mid)) pos = mid;
    else { const f = [...gr.cells].find(ok); pos = f === undefined ? -1 : f; }
  }
  if (pos < 0) return null;
  return { i: pos, k, c: gr.c };
}

// ---------------------------------------------------------------- impactos
function newWave() { return { hits: new Map(), matchCells: new Set(), queue: [], fx: [], consumed: new Set() }; }

function hitCell(g, w, i, t) {
  if (g.hole[i]) return;
  if (w.hits.has(i)) { if (t < w.hits.get(i)) w.hits.set(i, t); return; }
  w.hits.set(i, t);
  const p = g.p[i];
  if (p && isSpecialK(p.k) && !w.consumed.has(p.id)) w.queue.push({ i, t, p });
}

function beamRow(g, w, y, x0, t0) {
  w.fx.push({ type: 'beam', dir: 'h', i: I(x0, y), t: t0 });
  for (let x = 0; x < W; x++) hitCell(g, w, I(x, y), t0 + 28 * Math.abs(x - x0));
}
function beamCol(g, w, x, y0, t0) {
  w.fx.push({ type: 'beam', dir: 'v', i: I(x, y0), t: t0 });
  for (let y = 0; y < H; y++) hitCell(g, w, I(x, y), t0 + 28 * Math.abs(y - y0));
}
function blast(g, w, i, r, t0, square) {
  const x = X(i), y = Y(i);
  w.fx.push({ type: 'blast', i, r, t: t0 });
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const d = square ? Math.max(Math.abs(dx), Math.abs(dy)) : Math.abs(dx) + Math.abs(dy);
    if (d > r || !inB(x + dx, y + dy)) continue;
    hitCell(g, w, I(x + dx, y + dy), t0 + 45 * d);
  }
}

function zapColor(g, w, from, c, t0) {
  const targets = [];
  for (let j = 0; j < N; j++) { const q = g.p[j]; if (matchable(q) && q.c === c) targets.push(j); }
  w.fx.push({ type: 'zap', i: from, to: targets.slice(), t: t0 });
  targets.forEach((j, n) => hitCell(g, w, j, t0 + 110 + n * 30));
  return targets;
}

function activate(g, w, i, p, t) {
  const x = X(i), y = Y(i);
  if (p.k === K.LH) beamRow(g, w, y, x, t + 30);
  else if (p.k === K.LV) beamCol(g, w, x, y, t + 30);
  else if (p.k === K.BOMB) blast(g, w, i, 2, t + 60, false);
  else if (p.k === K.BAT) {
    const cnt = new Array(8).fill(0);
    for (let j = 0; j < N; j++) { const q = g.p[j]; if (matchable(q) && !w.hits.has(j)) cnt[q.c]++; }
    let c = -1, best = 0;
    for (let k = 0; k < 8; k++) if (cnt[k] > best) { best = cnt[k]; c = k; }
    if (c >= 0) zapColor(g, w, i, c, t + 40);
  }
}

// combinación por intercambio. ia = donde quedó la pieza arrastrada.
function comboWave(g, ia, ib, steps) {
  const w = newWave();
  const A = g.p[ia], B = g.p[ib];
  if (A.k === K.BAT || B.k === K.BAT) {
    const iBat = A.k === K.BAT ? ia : ib, iO = iBat === ia ? ib : ia;
    const bat = g.p[iBat], O = g.p[iO];
    w.consumed.add(bat.id);
    if (O.k === K.BAT) {
      w.consumed.add(O.id);
      w.fx.push({ type: 'nova', i: ia, t: 0 });
      const cx = X(ia), cy = Y(ia);
      for (let j = 0; j < N; j++) hitCell(g, w, j, 140 + 40 * Math.max(Math.abs(X(j) - cx), Math.abs(Y(j) - cy)));
    } else {
      const c = O.c;
      if (O.k === K.LH || O.k === K.LV || O.k === K.BOMB) {
        const tr = [];
        for (let j = 0; j < N; j++) {
          const q = g.p[j];
          if (q && q.k === K.N && q.c === c && !q.lock) {
            q.k = O.k === K.BOMB ? K.BOMB : (g.rng() < 0.5 ? K.LH : K.LV);
            tr.push({ id: q.id, i: j, k: q.k });
          }
        }
        if (tr.length) steps.push({ t: 'transform', list: tr });
      }
      hitCell(g, w, iBat, 0);
      zapColor(g, w, iBat, c, 0);
    }
  } else {
    w.consumed.add(A.id); w.consumed.add(B.id);
    hitCell(g, w, ia, 0); hitCell(g, w, ib, 0);
    const cx = X(ia), cy = Y(ia);
    const line = k => k === K.LH || k === K.LV;
    if (line(A.k) && line(B.k)) {
      beamRow(g, w, cy, cx, 30); beamCol(g, w, cx, cy, 30);
    } else if (A.k === K.BOMB && B.k === K.BOMB) {
      blast(g, w, ia, 2, 60, true);
      w.fx[w.fx.length - 1].big = true;
    } else {
      for (let d = -1; d <= 1; d++) {
        if (cy + d >= 0 && cy + d < H) beamRow(g, w, cy + d, cx, 40);
        if (cx + d >= 0 && cx + d < W) beamCol(g, w, cx + d, cy, 40);
      }
    }
  }
  return w;
}

// ---------------------------------------------------------------- aplicar
function addGoal(g, type, n) { for (const o of g.goals) if (o.type === type) o.have += n; }
function addCollect(g, c, n) { for (const o of g.goals) if (o.type === 'collect' && o.color === c) o.have += n; }
function syncScore(g) { for (const o of g.goals) if (o.type === 'score') o.have = g.score; }
function snap(g) { return { score: g.score, have: g.goals.map(o => o.have), moves: g.moves }; }

function applyWave(g, w, cascade, created) {
  const step = { t: 'clear', cascade, cleared: [], pads: [], burnt: [], unlocks: [], created: [], fx: w.fx, score: 0, popups: [] };
  let pts = 0, cx = 0, cy = 0, cn = 0;
  const burntDone = new Set();
  const dmgBurnt = (i, t) => {
    if (burntDone.has(i)) return;
    burntDone.add(i);
    const p = g.p[i];
    p.hp--; addGoal(g, 'burnt', 1); pts += 60;
    step.burnt.push({ i, id: p.id, hp: p.hp, t });
    if (p.hp <= 0) g.p[i] = null;
    cx += X(i); cy += Y(i); cn++;
  };
  for (const [i, t] of w.hits) {
    if (g.pad[i] > 0) { g.pad[i]--; addGoal(g, 'pads', 1); pts += 40; step.pads.push({ i, lv: g.pad[i], t }); }
    const p = g.p[i];
    if (!p) continue;
    if (p.k === K.BURNT) { dmgBurnt(i, t); continue; }
    if (p.lock) { p.lock = 0; addGoal(g, 'locks', 1); pts += 40; step.unlocks.push({ i, id: p.id, t }); continue; }
    if (p.k === K.TUBE) continue;
    g.p[i] = null;
    step.cleared.push({ i, id: p.id, c: p.c, k: p.k, t });
    pts += 20; cx += X(i); cy += Y(i); cn++;
    if (p.c >= 0) addCollect(g, p.c, 1);
  }
  for (const i of w.matchCells) {
    const x = X(i), y = Y(i);
    const nb = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
    for (const [nx, ny] of nb) {
      if (!inB(nx, ny)) continue;
      const j = I(nx, ny), q = g.p[j];
      if (q && q.k === K.BURNT) dmgBurnt(j, 60);
    }
  }
  for (const s of created) {
    if (g.p[s.i] !== null) continue;
    const np = mk(g, s.k === K.BAT ? -1 : s.c, s.k);
    g.p[s.i] = np;
    step.created.push({ i: s.i, id: np.id, c: np.c, k: np.k });
    pts += s.k === K.BAT ? 200 : s.k === K.BOMB ? 100 : 60;
  }
  step.score = pts * Math.min(cascade, 8);
  g.score += step.score;
  syncScore(g);
  if (step.score > 0) {
    if (cn === 0 && step.pads.length) { for (const p of step.pads) { cx += X(p.i); cy += Y(p.i); cn++; } }
    if (cn > 0) step.popups.push({ x: cx / cn, y: cy / cn, v: step.score, cascade });
  }
  step.snap = snap(g);
  return step;
}

function countTubes(g) { let n = 0; for (let i = 0; i < N; i++) { const p = g.p[i]; if (p && p.k === K.TUBE) n++; } return n; }

// ---------------------------------------------------------------- caída
// La caída avanza de a un casillero por paso ("tick"):
//  1. Cae derecho todo lo que puede. Los huecos de la placa se atraviesan; los quemados
//     y las piezas encintadas no dejan pasar nada.
//  2. Entra una pieza nueva arriba de cada columna que tenga lugar.
//  3. Un lugar vacío tapado desde arriba por un quemado o una cinta se llena en diagonal (45°)
//     con una pieza quieta de una columna vecina. Uno por columna y por paso; las válvulas
//     nunca se mueven en diagonal.
// Un lugar sin camino desde arriba queda vacío hasta que se rompa lo que lo tapa.
function movable(p) { return p !== null && !fixed(p); }
function belowCell(g, i) { const x = X(i); for (let y = Y(i) + 1; y < H; y++) { const j = I(x, y); if (!g.hole[j]) return j; } return -1; }
function aboveCell(g, i) { const x = X(i); for (let y = Y(i) - 1; y >= 0; y--) { const j = I(x, y); if (!g.hole[j]) return j; } return -1; }
function colTop(g, x) { for (let y = 0; y < H; y++) { const j = I(x, y); if (!g.hole[j]) return j; } return -1; }

SPR.coil = (function () {
  const pal = { a: '#7fd487', b: '#36a456', c: '#1f6e36', u: '#ffc489', v: '#dd8a40', w: '#9a5320', l: '#dd8a40' };
  const rows = [];
  const cx = 8, cy = 7, R = 6.9, r = 2.6, turns = 9;
  for (let y = 0; y < 16; y++) {
    let row = '';
    for (let x = 0; x < 16; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy);
      if (d <= R && d >= r) {
        const a = Math.atan2(dy, dx);
        const f = ((a / (Math.PI * 2)) * turns + 10) % 1;
        const shade = (dx + dy) / d;
        const copper = f < 0.4;
        const edge = d > R - 1.1 || d < r + 0.9;
        if (copper) row += f < 0.13 ? 'u' : (shade > 0.55 ? 'w' : 'v');
        else row += edge ? (shade > 0.2 ? 'c' : 'b') : (shade < -0.3 ? 'a' : 'b');
      } else if ((x === 6 || x === 9) && y >= 13 && y <= 14) row += 'l';
      else row += '.';
    }
    rows.push(row);
  }
  return { pal, rows };
})();

const OUTLINE = '#120d0b';

function withOutline(rows) {
  const g = rows.map(r => r.split(''));
  const out = g.map(r => r.slice());
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (g[y][x] !== '.') continue;
    const nb = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]];
    if (nb.some(([a, b]) => a >= 0 && a < 16 && b >= 0 && b < 16 && g[b][a] !== '.')) out[y][x] = '#';
  }
  return out;
}

const RAINBOW = ['#ff4b4b', '#ff9f1c', '#ffe14a', '#3ee07a', '#3fa9ff', '#a66bff'];

// Dibuja un sprite en un canvas de `size` px. hueShift sólo para la batería.
function renderSprite(name, size, opts) {
  opts = opts || {};
  const def = SPR[name];
  const grid = def.noOutline ? def.rows.map(r => r.split('')) : withOutline(def.rows);
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const s = size / 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const ch = grid[y][x];
    if (ch === '.') continue;
    let col = ch === '#' ? OUTLINE : def.pal[ch];
    if (col === 'rainbow') col = RAINBOW[(x + (opts.hue || 0)) % RAINBOW.length];
    if (opts.tint && ch !== '#') col = opts.tint;
    ctx.fillStyle = col;
    const x0 = Math.round(x * s), y0 = Math.round(y * s);
    ctx.fillRect(x0, y0, Math.round((x + 1) * s) - x0, Math.round((y + 1) * s) - y0);
  }
  return cv;
}

// Overlays de especiales (flechas) y cinta kapton
function renderOverlay(kind, size) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const s = size / 16;
  const px = (x, y, c) => { ctx.fillStyle = c; const x0 = Math.round(x * s), y0 = Math.round(y * s); ctx.fillRect(x0, y0, Math.round((x + 1) * s) - x0, Math.round((y + 1) * s) - y0); };
  if (kind === 'lineH' || kind === 'lineV') {
    const arrow = [[2, 5], [1, 6], [2, 6], [0, 7], [1, 7], [2, 7], [0, 8], [1, 8], [2, 8], [1, 9], [2, 9], [2, 10]];
    const pts = [];
    for (const [x, y] of arrow) { pts.push([x, y]); pts.push([15 - x, y]); }
    const set = new Set(pts.map(([x, y]) => kind === 'lineH' ? x + ',' + y : y + ',' + x));
    for (const k of set) {
      const [x, y] = k.split(',').map(Number);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < 16 && ny >= 0 && ny < 16 && !set.has(nx + ',' + ny)) px(nx, ny, OUTLINE);
      }
    }
    for (const k of set) { const [x, y] = k.split(',').map(Number); px(x, y, '#ffffff'); }
  } else if (kind === 'tape') {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const a = Math.abs(x - y), b = Math.abs(x + y - 15);
      if (a <= 1 || b <= 1) {
        const edge = (a === 1 && b > 1) || (b === 1 && a > 1);
        px(x, y, edge ? 'rgba(255,196,110,0.75)' : 'rgba(232,150,40,0.62)');
      }
    }
    for (const [x, y] of [[3, 3], [12, 3], [3, 12], [12, 12]]) px(x, y, 'rgba(255,236,190,0.9)');
  }
  return cv;
}

const KEY = 'chispazo.v1';
const Save = {
  data: { stars: {}, best: {} },
  settings: { sfx: 0.7, music: 0.35, mute: false, style: '8' },
  load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d.progress && d.progress.stars) this.data = { stars: d.progress.stars || {}, best: d.progress.best || {} };
      if (d.settings) Object.assign(this.settings, d.settings);
    } catch (e) {}
  },
  persist() { try { localStorage.setItem(KEY, JSON.stringify({ progress: this.data, settings: this.settings })); } catch (e) {} },
  record(n, stars, score) {
    const s = this.data.stars, b = this.data.best;
    let changed = false;
    if (stars > (s[n] || 0)) { s[n] = stars; changed = true; }
    if (stars > 0 && score > (b[n] || 0)) { b[n] = score; changed = true; }
    this.persist();
    if (changed) Cloud.push();
  },
  merge(o) {
    let changed = false;
    if (!o) return false;
    for (const [k, v] of Object.entries(o.stars || {})) if ((+v || 0) > (this.data.stars[k] || 0)) { this.data.stars[k] = +v; changed = true; }
    for (const [k, v] of Object.entries(o.best || {})) if ((+v || 0) > (this.data.best[k] || 0)) { this.data.best[k] = +v; changed = true; }
    return changed;
  },
  stars(n) { return this.data.stars[n] || 0; },
  unlocked(n) { return n === 1 || this.stars(n - 1) > 0; },
  total() { let t = 0; for (let n = 1; n <= LEVELS.length; n++) t += this.stars(n); return t; },
  reset() { this.data = { stars: {}, best: {} }; this.persist(); Cloud.push(true); },
};

// Sincronización opcional con la cuenta (si el visor la ofrece): el avance te sigue entre dispositivos.
const Cloud = {
  ref: null, busy: false, pending: false,
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.ref = db.doc('data/users/' + uid + '/progress');
      const snap = await this.ref.get();
      const remote = snap.exists ? snap.data() : null;
      const gotNew = Save.merge(remote);
      if (gotNew) { Save.persist(); if (UI.screen === 'map') UI.renderMap(); }
      const same = remote && JSON.stringify(remote.stars || {}) === JSON.stringify(Save.data.stars) && JSON.stringify(remote.best || {}) === JSON.stringify(Save.data.best);
      if (!same && Save.total() > 0) this.push();
    } catch (e) { this.ref = null; }
  },
  async push(force) {
    if (!this.ref) return;
    if (this.busy) { this.pending = true; return; }
    this.busy = true;
    try { await this.ref.set({ stars: Save.data.stars, best: Save.data.best }); } catch (e) {}
    this.busy = false;
    if (this.pending) { this.pending = false; this.push(); }
  },
};

// Versión, búsqueda y actualización (#3)
const APPV = { ok: false, reg: null, nueva: false, buscando: false, recargar: false, ultima: 0 };
function versionRowHTML() {
  const t = '<b>Versión ' + FOGONAZO_VERSION.v + '</b>', f = FOGONAZO_VERSION.fecha ? 'Del ' + FOGONAZO_VERSION.fecha + '.' : '';
  if (!APPV.ok) return `<div class="verrow" id="verRow"><span class="vt">${t}<small>${f}</small></span></div>`;
  if (APPV.nueva) return `<div class="verrow" id="verRow"><span class="vt">${t}<small>${f}</small><span class="ver-new"><i class="led-g" aria-hidden="true"></i>Hay una versión nueva</span></span><button class="btn small" data-v="up">Actualizar</button></div>`;
  return `<div class="verrow" id="verRow"><span class="vt">${t}<small>${f} Es la más reciente.</small></span><button class="btn small ghost" data-v="buscar"${APPV.buscando ? ' disabled' : ''}>${APPV.buscando ? 'Buscando…' : 'Buscar'}</button></div>`;
}
// Actualiza la fila de Ajustes y el LED del engranaje sin volver a dibujar la pantalla
function pintarVersion() {
  const row = $('#verRow');
  if (row) row.outerHTML = versionRowHTML();
  const gear = $('#btnSettings');
  if (gear) {
    const led = gear.querySelector('.gear-led');
    if (APPV.nueva && !led) gear.insertAdjacentHTML('beforeend', '<i class="gear-led" aria-hidden="true"></i>');
    if (!APPV.nueva && led) led.remove();
    gear.setAttribute('aria-label', APPV.nueva ? 'Ajustes: hay una versión nueva' : 'Ajustes');
  }
}
function marcarNueva() { APPV.nueva = true; APPV.buscando = false; pintarVersion(); }
function vigilarInstalacion(w) {
  if (!w) return;
  w.addEventListener('statechange', () => {
    if (w.state === 'installed' && navigator.serviceWorker.controller) marcarNueva();
    if (w.state === 'redundant' && APPV.buscando) { APPV.buscando = false; pintarVersion(); toast('No se pudo bajar la versión nueva. Probá de nuevo más tarde.'); }
  });
}
function iniciarApp() {
  if (!('serviceWorker' in navigator) || !publicado()) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    APPV.ok = true; APPV.reg = reg; APPV.ultima = Date.now();
    if (reg.waiting && navigator.serviceWorker.controller) APPV.nueva = true;
    vigilarInstalacion(reg.installing);
    reg.addEventListener('updatefound', () => vigilarInstalacion(reg.installing));
    pintarVersion();
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (APPV.recargar) location.reload(); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && APPV.reg && Date.now() - APPV.ultima > 30 * 60 * 1000) {
      APPV.ultima = Date.now(); APPV.reg.update().catch(() => {});
    }

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
function buscarVersion() {
  if (!APPV.reg || APPV.buscando) return;
  if (navigator.onLine === false) { toast('Sin conexión: no se pudo buscar.'); return; }
  APPV.buscando = true; pintarVersion();
  APPV.reg.update().then(() => {
    APPV.ultima = Date.now();
    const reg = APPV.reg;
    if (reg.waiting && navigator.serviceWorker.controller) { marcarNueva(); return; }
    if (reg.installing) return;   // la está bajando: vigilarInstalacion avisa cuando termina
    APPV.buscando = false; pintarVersion(); toast('Ya tenés la versión más reciente.');
  }).catch(() => { APPV.buscando = false; pintarVersion(); toast('Sin conexión: no se pudo buscar.'); });
}
function actualizarApp() {
  const w = APPV.reg && APPV.reg.waiting;
  if (!w) { location.reload(); return; }
  APPV.recargar = true;
  try { sessionStorage.setItem('fogonazo-actualizado', '1'); } catch (e) {}

  setTimeout(() => location.reload(), 3000);   // por si el teléfono no avisa el cambio
}

  if (hecho) toast('Listo: ya tenés la versión ' + FOGONAZO_VERSION.v + '.');

// ------------------------------------------------------------ sprites en caché
const Spr = {

  get(name, size, hue) {

  },
  ov(kind, size) {

function pieceSprite(c, k, hp) {

// ícono suelto (canvas) para HUD y modales

  const put = (name, ov) => { ctx.drawImage(renderSprite(name, px), 0, 0); if (ov) ctx.drawImage(renderOverlay(ov, px), 0, 0); };
  if (kind === 'piece') put(PIECE_SPRITES[arg]);
  else if (kind === 'pads') put(arg === 2 ? 'pad2' : 'pad1');
  else if (kind === 'burnt') put(arg === 2 ? 'burnt2' : 'burnt1');
  else if (kind === 'locks') put(PIECE_SPRITES[arg || 1], 'tape');
  else if (kind === 'tubes') put('tube');
  else if (kind === 'battery') put('battery');
  else if (kind === 'lineH') put(PIECE_SPRITES[arg || 2], 'lineH');
  else if (kind === 'lineV') put(PIECE_SPRITES[arg || 4], 'lineV');

function applyArt() {
  document.documentElement.dataset.art = ART.style;
  if (ART.style === '16' && !applyArt.tex) applyArt.tex = pcbTexture();
  if (applyArt.tex) document.documentElement.style.setProperty('--pcb-tex', `url(${applyArt.tex})`);
}
// textura de placa para el mapa en 16 bits: pistas con codos a 45° y vías
function pcbTexture() {
  const W = 480, H = 240, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const rnd = E.rngFrom(4242);
  c.lineCap = 'square'; c.lineJoin = 'miter';
  for (let k = 0; k < 16; k++) {
    let x = Math.round(rnd() * W / 16) * 16, y = Math.round(rnd() * H / 16) * 16;
    const pts = [[x, y]];
    for (let s = 0; s < 4; s++) {
      const d = (rnd() * 4) | 0, L = 32 + ((rnd() * 5) | 0) * 16;
      if (d === 0) x += L; else if (d === 1) y += L; else if (d === 2) { x += L / 2; y += L / 2; } else { x += L / 2; y -= L / 2; }
      pts.push([x, y]);
    }
    for (const [w, col] of [[7, 'rgba(10,50,30,0.55)'], [5, 'rgba(46,140,92,0.55)'], [1.5, 'rgba(150,235,190,0.35)']]) {
      c.strokeStyle = col; c.lineWidth = w; c.beginPath();
      pts.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py)));
      c.stroke();
    }
    const [ex, ey] = pts[pts.length - 1];
    c.fillStyle = '#c9a24a'; c.beginPath(); c.arc(ex, ey, 6, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#082c1d'; c.beginPath(); c.arc(ex, ey, 2.5, 0, Math.PI * 2); c.fill();
  }
  return cv.toDataURL('image/png');
}
function setStyle(st) {
  if (st !== '8' && st !== '16') return;
  ART.style = st; Save.settings.style = st; Save.persist();
  applyArt();
  Spr.clear(); View.restyle();
  if (UI.screen === 'game') HUD.refreshIcons();
  if (typeof Sound.restyle === 'function') Sound.restyle(st);
}

// ------------------------------------------------------------ vista del tablero
const View = (() => {
  const cv = $('#board'), ctx = cv.getContext('2d');
  let g = null;
  let dpr = 1, cssS = 320, Wd = 320, cell = 40, sp = 36, bg = null, holeLayer = null;
  const pieces = new Map();
  let padLv = new Uint8Array(64), padOrig = new Uint8Array(64);
  const padFlash = new Float64Array(64);
  let fx = [], parts = [], texts = [], timeline = [];
  let sel = -1, hint = null, shakeT = 0, shakeAmp = 0, mosaicT = 0;
  const mosaicCv = document.createElement('canvas');

  function after(ms, fn) { timeline.push({ at: performance.now() + ms, fn }); }
  function wait(ms) { return new Promise(res => after(ms, res)); }

  function reset(game) {
    g = game;
    pieces.clear(); fx = []; parts = []; texts = []; timeline = []; sel = -1; hint = null;
    padOrig = g.padOrig.slice(); padLv = g.pad.slice(); padFlash.fill(0);
    for (let i = 0; i < 64; i++) { const p = g.p[i]; if (p) addPiece(p.id, p.c, p.k, X(i), Y(i), p); }
    buildLayers();
  }
  function addPiece(id, c, k, x, y, src) {
    const pv = { id, c, k, x, y, lock: src ? src.lock : 0, hp: src ? src.hp : 0, mv: null, pop: 0, born: 0, flash: 0, land: 0, shuf: 0, nc: c, collect: 0, phase: Math.random() * 5 };
    pieces.set(id, pv);
    return pv;
  }
  function moveTo(pv, x, y, dur, ease, then) {
    pv.mv = { x0: pv.x, y0: pv.y, x1: x, y1: y, t0: performance.now(), dur, ease, then };
  }
  function setTrack(pv, x, y, path, t0) {
    const segs = [];
    let px = x, py = y;
    for (const [k, nx, ny] of path) {
      segs.push({ a: t0 + E.tickStart(k), b: t0 + E.tickStart(k + 1), x0: px, y0: py, x1: nx, y1: ny });
      px = nx; py = ny;
    }
    pv.mv = null; pv.x = x; pv.y = y;
    pv.track = segs.length ? segs : null;
  }
  function trackPos(pv, t) {
    const s0 = pv.track[0];
    let x = s0.x0, y = s0.y0;
    for (const s of pv.track) {
      if (t < s.a) break;
      const p = clamp((t - s.a) / (s.b - s.a), 0, 1);
      x = lerp(s.x0, s.x1, p); y = lerp(s.y0, s.y1, p);
    }
    return [x, y];
  }

  function resize() {
    const wrap = $('#boardWrap');
    const r = wrap.getBoundingClientRect();
    const avail = Math.floor(Math.min(r.width - 16, r.height - 46));
    const s = clamp(avail, 200, 560);
    dpr = Math.min(3, window.devicePixelRatio || 1);
    const dev = Math.round(s * dpr / 8) * 8;
    if (dev === Wd && Math.abs(cssS - dev / dpr) < 0.5) return;
    Wd = dev; cssS = dev / dpr; cell = dev / 8;
    sp = Math.round(cell * 0.94);
    cv.width = cv.height = dev;
    cv.style.width = cv.style.height = cssS + 'px';
    Spr.clear();
    buildLayers();
  }

  function buildLayers() {
    if (!g) return;
    bg = document.createElement('canvas'); bg.width = bg.height = Wd;
    const b = bg.getContext('2d');
    const px = cell / 16;
    if (ART.style === '16') drawBoard16(b);
    else for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const x0 = Math.round(x * cell), y0 = Math.round(y * cell), x1 = Math.round((x + 1) * cell), y1 = Math.round((y + 1) * cell);
      b.fillStyle = (x + y) % 2 ? '#11523a' : '#0f4a33';
      b.fillRect(x0, y0, x1 - x0, y1 - y0);
      b.fillStyle = '#0c3f2b';
      b.fillRect(x0, y1 - Math.ceil(px), x1 - x0, Math.ceil(px));
      b.fillRect(x1 - Math.ceil(px), y0, Math.ceil(px), y1 - y0);
      b.fillStyle = 'rgba(210,240,225,0.18)';
      b.fillRect(x0 + Math.round(px), y0 + Math.round(px), Math.ceil(px), Math.ceil(px));
    }
    holeLayer = document.createElement('canvas'); holeLayer.width = holeLayer.height = Wd;
    const h = holeLayer.getContext('2d');
    const isHole = (x, y) => x >= 0 && x < 8 && y >= 0 && y < 8 && g.hole[y * 8 + x];
    const edge = Math.max(2, Math.round(px * 1.5));
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      if (!isHole(x, y)) continue;
      const x0 = Math.round(x * cell), y0 = Math.round(y * cell), w = Math.round((x + 1) * cell) - x0, hh = Math.round((y + 1) * cell) - y0;
      h.fillStyle = '#1a252d'; h.fillRect(x0, y0, w, hh);

      h.fillStyle = '#062016';
      if (!isHole(x, y - 1) && y > 0) h.fillRect(x0, y0, w, edge);
      if (!isHole(x, y + 1) && y < 7) h.fillRect(x0, y0 + hh - edge, w, edge);
      if (!isHole(x - 1, y) && x > 0) h.fillRect(x0, y0, edge, hh);
      if (!isHole(x + 1, y) && x < 7) h.fillRect(x0 + w - edge, y0, edge, hh);
    }
  }

  // placa 16 bits: máscara antisoldante con degradé, pistas de cobre en las calles y vías
  function drawBoard16(b) {
    const u = cell / 32, R = Math.round;
    const rnd = E.rngFrom(((g.level && g.level.n) || 7) * 7919 + 13);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const x0 = R(x * cell), y0 = R(y * cell), w = R((x + 1) * cell) - x0, h = R((y + 1) * cell) - y0;
      const gr = b.createLinearGradient(0, y0, 0, y0 + h);
      const odd = (x + y) % 2;
      gr.addColorStop(0, odd ? '#16603f' : '#135739'); gr.addColorStop(1, odd ? '#0f4c32' : '#0d452d');
      b.fillStyle = gr; b.fillRect(x0, y0, w, h);
      b.fillStyle = 'rgba(255,255,255,0.05)'; b.fillRect(x0, y0, w, R(u));
      b.fillStyle = 'rgba(0,0,0,0.18)'; b.fillRect(x0, y0 + h - R(u), w, R(u));
    }
    const trace = (x0, y0, x1, y1) => {
      const t = Math.max(2, R(u * 2.2));

      if (y0 === y1) b.fillRect(R(x0), R(y0 - t / 2), R(x1 - x0), t); else b.fillRect(R(x0 - t / 2), R(y0), t, R(y1 - y0));
      b.fillStyle = 'rgba(140,230,180,0.35)';
      if (y0 === y1) b.fillRect(R(x0), R(y0 - t / 2), R(x1 - x0), Math.max(1, R(u * 0.6))); else b.fillRect(R(x0 - t / 2), R(y0), Math.max(1, R(u * 0.6)), R(y1 - y0));

    }
    for (let y = 1; y < 8; y++) for (let x = 1; x < 8; x++) {

      b.fillStyle = '#d9b456'; b.beginPath(); b.arc(cx - u * 0.4, cy - u * 0.4, u * 2.7, 0, Math.PI * 2); b.fill();
      b.fillStyle = '#071d13'; b.beginPath(); b.arc(cx, cy, u * 1.3, 0, Math.PI * 2); b.fill();
    }
  }

  // ---------- partículas y efectos
  function burst(x, y, color, n, speed) {
    if (REDUCED) n = Math.min(n, 4);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = (0.6 + Math.random()) * (speed || 3.2) * cell;

  function drawPiece(pv, t) {

      const fp = (now - padFlash[i]) / 300;

    }

        const w = Math.max(1, Math.round(Wd / blk));

        const m = mosaicCv.getContext('2d');
        m.imageSmoothingEnabled = true;
        m.drawImage(cv, 0, 0, w, w);

      const x = Math.floor((clientX - r.left) / r.width * 8), y = Math.floor((clientY - r.top) / r.height * 8);
      return x >= 0 && x < 8 && y >= 0 && y < 8 ? y * 8 + x : -1;
    },
    cellCss() { return cv.getBoundingClientRect().width / 8; },
    nudge(i) { const p = g && g.p[i]; if (!p) return; const pv = pieces.get(p.id); if (pv) { pv.flash = performance.now(); } },
    canvas: cv,
  };
})();

const Seg = (() => {
  const P = {
    a: '2,0.4 10,0.4 11,1.4 10,2.4 2,2.4 1,1.4', g: '2,9 10,9 11,10 10,11 2,11 1,10', d: '2,17.6 10,17.6 11,18.6 10,19.6 2,19.6 1,18.6',
    f: '1,2.2 2,3.2 2,8.4 1,9.4 0,8.4 0,3.2', b: '11,2.2 12,3.2 12,8.4 11,9.4 10,8.4 10,3.2',
    e: '1,10.6 2,11.6 2,16.8 1,17.8 0,16.8 0,11.6', c: '11,10.6 12,11.6 12,16.8 11,17.8 10,16.8 10,11.6',
  };
  const D = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '' };
  function build(el, n, colonAfter) {
    el.innerHTML = '';
    for (let k = 0; k < n; k++) {
      el.insertAdjacentHTML('beforeend', `<svg viewBox="-1 -0.5 14 21"><g transform="skewX(-6) translate(1 0)">${Object.entries(P).map(([s, pts]) => `<polygon data-s="${s}" points="${pts}" class="off"/>`).join('')}</g></svg>`);
      if (colonAfter === k) el.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 4 21" style="width:auto"><rect x="1" y="5" width="2" height="2.4" class="on"/><rect x="1" y="13" width="2" height="2.4" class="on"/></svg>');
    }
    el._n = n; el._last = null;
  }
  function set(el, str) {
    str = String(str);
    if (str.length < el._n) str = ' '.repeat(el._n - str.length) + str;
    str = str.slice(-el._n);
    if (el._last === str) return;
    el._last = str;
    const digits = [...el.querySelectorAll('svg')].filter(s => s.querySelector('polygon'));
    digits.forEach((svg, k) => {
      const on = D[str[k]] || '';
      svg.querySelectorAll('polygon').forEach(p => p.setAttribute('class', on.includes(p.dataset.s) ? 'on' : 'off'));
    });
  }
  return { build, set };
})();

const HUD = {
  def: null, shown: 0, target: 0, chips: [], segs: 12,
  init(def, g) {
    this.def = def; this.shown = 0; this.target = 0;
    $('#lvlNum').textContent = 'NIVEL ' + def.n + ' · ' + BLOCKS[def.block].name.toUpperCase();
    $('#lvlName').textContent = def.name;
    $('#lvlName').classList.toggle('long', def.name.length > 18);
    const timed = g.mode === 'time';
    $('#movesLabel').textContent = timed ? 'TIEMPO' : 'MOV';
    if (timed) Seg.build($('#segMoves'), 3, 0); else Seg.build($('#segMoves'), 2);
    $('#segMoves').classList.remove('warn');
    Seg.build($('#segScore'), 6);
    Seg.set($('#segScore'), '0');
    if (timed) this.setTime(def.time); else this.setMoves(g.moves);
    const vu = $('#vu');
    vu.innerHTML = '';
    for (let k = 0; k < this.segs; k++) vu.insertAdjacentHTML('beforeend', `<i class="${k >= 10 ? 'r' : k >= 7 ? 'y' : ''}"></i>`);
    const st = $('#vuStars');
    st.innerHTML = '';
    const max = def.stars[2];
    const marks = g.scoreOnly ? def.stars : [def.stars[1], def.stars[2]];
    marks.forEach((v, k) => {
      const pct = clamp(v / max * 100, 4, 96);
      st.insertAdjacentHTML('beforeend', `<span data-v="${v}" style="position:absolute;left:${pct}%;top:0">${svgStar(false)}</span>`);
    });
    const goals = $('#goals');
    goals.innerHTML = '';
    this.chips = g.goals.map((o, k) => {
      const chip = document.createElement('div');
      chip.className = 'goal';
      const lv = o.type === 'pads' ? (g.padOrig.some(v => v === 2) ? 2 : 1) : o.type === 'burnt' ? (g.p.some(p => p && p.k === K.BURNT && p.hp >= 2) ? 2 : 1) : 1;
      const mkIcon = o.type === 'score' ? null : o.type === 'collect' ? () => iconCanvas('piece', o.color, 32) : () => iconCanvas(o.type, lv, 32);
      if (mkIcon) chip.appendChild(mkIcon());
      if (o.type === 'score') chip.insertAdjacentHTML('beforeend', `<span class="lbl">Meta</span>`);
      const cnt = document.createElement('span'); cnt.className = 'cnt';
      chip.appendChild(cnt);
      goals.appendChild(chip);
      return { chip, cnt, o, last: -1, mkIcon };
    });
    this.setGoals(g.goals.map(o => o.have));
    this.renderVU(0);
  },
  refreshIcons() { for (const c of this.chips) if (c.mkIcon) { const old = c.chip.querySelector('canvas'); if (old) old.replaceWith(c.mkIcon()); } },
  setMoves(n) { Seg.set($('#segMoves'), Math.max(0, n)); },
  setTime(sec) {
    const s = Math.max(0, Math.ceil(sec));
    Seg.set($('#segMoves'), Math.floor(s / 60) + String(s % 60).padStart(2, '0'));
    $('#segMoves').classList.toggle('warn', s <= 10 && s > 0);
  },
  setScore(v) { this.target = v; },
  setGoals(have) {
    this.chips.forEach((c, k) => {
      const o = c.o, h = have[k];
      let txt, done;
      if (o.type === 'score') { txt = fmt(o.need); done = h >= o.need; }
      else { const rem = Math.max(0, o.need - h); txt = String(rem); done = rem === 0; }
      if (c.last !== txt) {
        if (c.last !== -1 && o.type !== 'score') { c.chip.classList.remove('bump'); void c.chip.offsetWidth; c.chip.classList.add('bump'); }
        c.cnt.textContent = txt;
        if (done && !c.chip.classList.contains('done') && c.last !== -1) Sound.play('goal');
        c.chip.classList.toggle('done', done);
        c.last = txt;
      }
    });
  },
  renderVU(v) {
    const max = this.def.stars[2];
    const lit = Math.round(clamp(v / max, 0, 1) * this.segs);
    $('#vu').querySelectorAll('i').forEach((el, k) => el.classList.toggle('lit', k < lit));
    $('#vuStars').querySelectorAll('span').forEach(sp => {
      const on = v >= +sp.dataset.v;
      if (sp._on !== on) { sp.innerHTML = svgStar(on); sp._on = on; }
    });
  },
  tick(dt) {
    if (this.shown !== this.target) {
      const d = this.target - this.shown;
      this.shown += Math.sign(d) * Math.max(1, Math.abs(d) * Math.min(1, dt / 120));
      if (Math.abs(this.target - this.shown) < 1) this.shown = this.target;
      Seg.set($('#segScore'), Math.round(this.shown));
      this.renderVU(this.shown);
    }
  },
};

  battery: { icon: ['battery'], title: 'Nuevo: batería', text: '5 en línea arman una batería. Intercambiala con un componente y se eliminan todos los de ese tipo. Probá combinar dos especiales entre sí.' },

  burnt2: { icon: ['burnt', 2], title: 'Nuevo: carbonizados', text: 'Los que tienen carcasa metálica necesitan dos golpes: el primero saca la carcasa.' },
  locks: { icon: ['locks', 1], title: 'Nuevo: cinta kapton', text: 'La pieza encintada no se mueve ni deja pasar las piezas que caen. Incluila en una línea para despegarla.' },
  tubes: { icon: ['tubes'], title: 'Nuevo: válvulas', text: 'Bajalas hasta la fila de abajo. Caen cuando desaparecen las piezas que tienen debajo: hacé líneas por debajo de ellas.' },

function goalText(o, def) {
  if (o.type === 'score') return `Sumá ${fmt(o.n)} puntos`;
  if (o.type === 'collect') return `Juntá ${o.n} ${PIECE_SHORT[o.color]}`;
  if (o.type === 'pads') return 'Soldá todos los pads';
  if (o.type === 'burnt') return 'Sacá todos los quemados';
  if (o.type === 'locks') return 'Despegá toda la cinta';
  if (o.type === 'tubes') return `Bajá ${o.n} válvulas al zócalo`;
  return '';
}

const Game = {

  open(n) {
    this.n = n;
    this.def = levelDef(n);
