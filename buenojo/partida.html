<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3d28">
<title>Buen ojo · la partida</title>
<link rel="stylesheet" href="mesa.css">
<style>
/* A game of Buen ojo (S-29c to h). On the left, a neutral grey card taped to the table: the color appears on it for
   a few seconds and then it is rebuilt in the same place. On the right, a sheet with three brush strokes (hue,
   saturation, brightness) whose tracks are painted with the current color; a paint tube rides on each one and is
   dragged along it. Then both colors side by side, the score in red pen and, if the difference shows, what was off.
   Five colors per game; the practice keeps the color in view, with the numbers, and has no score. */
.cartulina { left: 32rem; top: 28rem; width: 455rem; height: 318rem; background-color: #7f7f7f;
  background-image: repeating-linear-gradient(35deg, rgba(255, 255, 255, .025) 0 1rem, transparent 1rem 4rem); box-shadow: 0 5rem 12rem rgba(0, 0, 0, .45); }
.cartulina > * { position: absolute; }
#muestra { left: 32rem; top: 32rem; width: 391rem; height: 254rem; transition: opacity .25s; }
#muestra.vacia { opacity: 0; }
.mitad { top: 32rem; width: 195.5rem; height: 254rem; }
#orig { left: 32rem; } #tuyo { left: 227.5rem; }
.etq { top: 292rem; width: 195.5rem; text-align: center; font-weight: 600; font-size: 15rem; letter-spacing: .14em; color: #ececea; }
#tiza { left: 32rem; top: 299rem; width: 391rem; height: 3rem; border-radius: 2rem; background: rgba(245, 245, 240, .85); transform-origin: left; }
#ronda { left: 226rem; top: 15rem; width: 74rem; height: 27rem; font-size: 16rem; line-height: 27rem; letter-spacing: .06em; text-align: center; transform: rotate(-2deg); }

.hoja { left: 512rem; top: 28rem; width: 368rem; height: 318rem; background: #f6f3ea;
  background-image: radial-gradient(rgba(0, 0, 0, .025) 1rem, transparent 1rem); background-size: 5rem 5rem; box-shadow: 0 5rem 12rem rgba(0, 0, 0, .4); }
.hoja > * { position: absolute; }
.fila { left: 0; width: 368rem; height: 86rem; touch-action: none; }
.fila > * { position: absolute; }
/* the label on top and the stroke below it, with room for the tube to pass under the letters (S-31) */
.fila .rotulo { left: 22rem; top: 0; }
.cifra { right: 22rem; top: 0; font-size: 14rem; line-height: 16rem; }
.trazo { left: 22rem; top: 33rem; width: 324rem; height: 30rem; overflow: visible; }
.vacio { left: 22rem; top: 37rem; width: 320rem; height: 20rem; border: 2rem dashed rgba(90, 90, 90, .28); border-radius: 11rem 14rem 9rem 15rem; }
.pomo { top: 22rem; width: 26rem; height: 52rem; margin-left: -13rem; filter: drop-shadow(0 3rem 2rem rgba(0, 0, 0, .45)); pointer-events: none; }
.pomo svg { width: 100%; height: 100%; display: block; }
#accion { left: 214rem; top: 274rem; width: 130rem; height: 40rem; --r: -1.5deg; transform: rotate(-1.5deg); }
#mirar { left: 24rem; top: 280rem; font-size: 17rem; }
/* the countdown before the color (S-31): chalk numbers on the grey card, where the color will appear */
#cuenta { left: 32rem; top: 32rem; width: 391rem; height: 254rem; display: flex; align-items: center; justify-content: center;
  font: 700 96rem/1 Barlow, sans-serif; color: rgba(245, 245, 240, .88); text-shadow: 0 2rem 0 rgba(0, 0, 0, .12); }
#cuenta.toca { animation: cuenta .6s ease-out; }
@keyframes cuenta { from { opacity: 0; transform: scale(.86); } 25% { opacity: 1; transform: scale(1); } }

#nota { left: 0; top: 0; width: 368rem; height: 260rem; }
#nota > * { position: absolute; }
#nota .nro { left: 22rem; top: 14rem; width: 112rem; height: 80rem; box-sizing: border-box; border: 3rem solid var(--rojo);
  border-radius: 52% 48% 55% 45% / 50% 55% 45% 50%; transform: rotate(-4deg); display: flex; align-items: center; justify-content: center;
  font-size: 52rem; color: var(--rojo); }
#nota .de { left: 144rem; top: 40rem; font-size: 27rem; color: var(--rojo); }
#nota .textos { left: 22rem; top: 98rem; width: 324rem; height: 172rem; display: flex; flex-direction: column; gap: 7rem; }
#frase { font-size: 27rem; line-height: 33rem; }
#ayuda { font-size: 17rem; line-height: 24rem; font-weight: 500; }
/* the values of both, always, as an informal table (S-32): the digits centered under each heading, the ° hanging */
#desglose { font-size: 13rem; line-height: 17rem; letter-spacing: .04em; }
#desglose .tabla { display: grid; grid-template-columns: max-content 80rem 80rem; column-gap: 14rem; row-gap: 3rem; font-variant-numeric: tabular-nums; }
#desglose .tabla .tit { font-weight: 600; color: #9a8b78; text-align: center; padding-bottom: 3rem; border-bottom: 1rem solid rgba(122, 108, 92, .3); }
#desglose .tabla .n { text-align: center; color: #4a4036; font-weight: 600; }
#desglose .tabla .n b { position: relative; font-weight: inherit; }
#desglose .tabla .n i { position: absolute; left: 100%; font-style: normal; }

/* which parts each moment shows */
#stage:not([data-fase=ver]):not([data-fase=practica]) .mitad, #stage:not([data-fase=ver]):not([data-fase=practica]) .etq { display: none; }
#stage[data-fase=ver] #muestra, #stage[data-fase=practica] #muestra { display: none; }
#stage:not([data-fase=mirar]) #tiza { visibility: hidden; }
#stage:not([data-fase=espera]) #cuenta { visibility: hidden; }
#stage:not([data-fase=espera]):not([data-fase=mirar]) .vacio, #stage:not([data-fase=espera]):not([data-fase=mirar]) #mirar { display: none; }
#stage[data-fase=espera] .trazo, #stage[data-fase=mirar] .trazo, #stage[data-fase=espera] .pomo, #stage[data-fase=mirar] .pomo { display: none; }
#stage:not([data-fase=ver]) #nota { display: none; }
#stage[data-fase=ver] .fila { display: none; }
#stage[data-fase=espera] #accion, #stage[data-fase=mirar] #accion { display: none; }
#stage:not([data-fase=practica]):not([data-fase=armar]) .cifra { display: none; }
/* while building, only the own value, small and light (S-32) */
#stage[data-fase=armar] .cifra { font-size: 11rem; top: 3rem; color: #a09280; }
#stage[data-fase=espera] .rotulo, #stage[data-fase=mirar] .rotulo { color: #a59684; }
#stage[data-fase=fin] .cartulina, #stage[data-fase=fin] .hoja, #stage[data-fase=fin] .tira { display: none; }

/* the end of a game (S-29g): a page of the sketchbook with the five chips, the total and the record */
/* on the page of the painted sketchbook (P-009), which the table shows in this moment */
#fin { left: 126rem; top: 22rem; width: 648rem; height: 342rem; z-index: 2; }
#fin > * { position: absolute; }
#finDif { left: 48rem; top: 18rem; color: var(--ladrillo); }
#total { left: 46rem; top: 40rem; font-size: 64rem; line-height: 70rem; font-weight: 700; white-space: nowrap; }
#total small { font-size: 24rem; font-weight: 500; color: #7a6c5c; }
#sello { left: 398rem; top: 30rem; transform: rotate(8deg); border: 3rem solid var(--rojo); border-radius: 6rem; padding: 3rem 14rem;
  font-weight: 700; font-size: 25rem; letter-spacing: .1em; color: var(--rojo); opacity: .9; }
#antes { left: 420rem; top: 84rem; font-size: 15rem; }
#fichas { left: 48rem; top: 132rem; display: flex; gap: 16rem; }
.ficha { width: 88rem; box-sizing: border-box; padding: 5rem 5rem 0; background: #fbfaf6; box-shadow: 0 2rem 4rem rgba(0, 0, 0, .3); transform: rotate(var(--r)); }
.ficha div { height: 80rem; display: flex; } .ficha div i { flex: 1; }
.ficha b { display: block; font: 700 21rem/34rem Barlow; text-align: center; color: #3a332c; }
#leyenda { left: 50rem; top: 264rem; font-size: 14rem; }
#otra { left: 456rem; top: 286rem; width: 150rem; height: 44rem; --r: -1.5deg; transform: rotate(-1.5deg); }
</style>
</head>
<body>
<!-- the brush mask of the strokes (S-30, variant B): a curved body, thicker in the middle, with rough edges and a short dry end -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="aspero" x="-4%" y="-40%" width="108%" height="180%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.045 0.32" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
<mask id="pincel" maskUnits="userSpaceOnUse" x="0" y="0" width="324" height="40"><g filter="url(#aspero)"><path d="M4,21 C3,13 10,8 22,7.5 C70,6 130,9 190,7 C235,5.5 270,8 296,10 C308,11 315,14 317,18 C319,22 314,26 303,28 C276,32 236,33 190,33.5 C130,34 70,31.5 24,33 C11,33.5 4,28 4,21 Z" fill="#fff"/><path d="M293,12.0 L314,12.1" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="17 2"/><path d="M294,16.0 L314,16.1" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="18 2"/><path d="M296,20.0 L312,20.3" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="14 1"/><path d="M287,24.0 L312,24.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="10 3"/><path d="M292,28.0 L311,28.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="12 3"/><path d="M250,13.0 L304,13.0" stroke="#000" stroke-opacity="0.26" stroke-width="0.5" stroke-linecap="round" stroke-dasharray="30 4"/><path d="M269,18.5 L296,18.5" stroke="#000" stroke-opacity="0.41" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="25 4"/><path d="M266,23.5 L299,23.5" stroke="#000" stroke-opacity="0.38" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="26 3"/><path d="M264,28.5 L306,28.5" stroke="#000" stroke-opacity="0.31" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="30 3"/><path d="M4,13.0 L25,13.0" stroke="#000" stroke-opacity=".3" stroke-width=".7" stroke-linecap="round"/><path d="M4,27.0 L18,27.0" stroke="#000" stroke-opacity=".3" stroke-width=".7" stroke-linecap="round"/></g></mask>
</defs></svg>
<div id="stage" data-fase="espera">
  <div id="mesa" aria-hidden="true"></div>

  <div class="cartulina">
    <div id="muestra" class="vacia"></div>
    <div id="orig" class="mitad"></div><div id="tuyo" class="mitad"></div>
    <div class="etq" style="left:32rem">REFERENCIA</div><div class="etq" style="left:227.5rem">TU INTENTO</div>
    <div id="tiza"></div>
    <div id="cuenta" aria-live="polite"></div>
  </div>
  <div class="tira" aria-hidden="true" style="left:20rem;top:18rem;transform:rotate(-38deg)"></div>
  <div class="tira" aria-hidden="true" style="left:438rem;top:18rem;transform:rotate(38deg)"></div>
  <div id="ronda" class="tira texto"></div>

  <div class="hoja">
    <div class="fila" id="filaH" style="top:16rem" role="slider" aria-label="Tono" aria-valuemin="0" aria-valuemax="360" tabindex="0">
      <div class="rotulo">TONO</div><div class="cifra suave"></div><div class="vacio"></div><svg class="trazo" viewBox="0 0 324 40" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient x1="0" x2="1"></linearGradient></defs><g mask="url(#pincel)"><rect width="324" height="40"/></g></svg><div class="pomo"></div>
    </div>
    <div class="fila" id="filaS" style="top:102rem" role="slider" aria-label="Saturación" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="rotulo">SATURACIÓN</div><div class="cifra suave"></div><div class="vacio"></div><svg class="trazo" viewBox="0 0 324 40" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient x1="0" x2="1"></linearGradient></defs><g mask="url(#pincel)"><rect width="324" height="40"/></g></svg><div class="pomo"></div>
    </div>
    <div class="fila" id="filaV" style="top:188rem" role="slider" aria-label="Brillo" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <div class="rotulo">BRILLO</div><div class="cifra suave"></div><div class="vacio"></div><svg class="trazo" viewBox="0 0 324 40" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient x1="0" x2="1"></linearGradient></defs><g mask="url(#pincel)"><rect width="324" height="40"/></g></svg><div class="pomo"></div>
    </div>
    <div id="mirar" class="suave">mirá bien…</div>
    <div id="nota" aria-live="polite">
      <div class="nro birome" id="nro"></div><div class="de birome">de 10</div>
      <div class="textos"><div id="frase" class="birome"></div><div id="ayuda" class="texto"></div><div id="desglose" class="suave"></div></div>
    </div>
    <button id="accion" class="cinta principal" type="button">Listo</button>
  </div>

  <div id="fin" hidden>
    <div id="finDif" class="rotulo"></div>
    <div id="total" class="texto"></div>
    <div id="sello" hidden>NUEVO RÉCORD</div>
    <div id="antes" class="suave"></div>
    <div id="fichas"></div>
    <div id="leyenda" class="suave">en cada muestra: el original a la izquierda, el tuyo a la derecha</div>
    <button id="otra" class="cinta principal" type="button">Otra partida</button>
  </div>

  <button id="volver" type="button" aria-label="Volver al block"><svg viewBox="0 0 132 34" aria-hidden="true"><path d="M2,4 h126 l-4,13 l4,13 h-126 l4,-13 z" fill="#1c1c1c"/><text x="66" y="23" text-anchor="middle" font-family="Barlow" font-weight="700" font-size="14" letter-spacing="2.2" fill="#f4f1ea">◀ VOLVER</text></svg></button>
</div>
<div id="rotate">Girá el teléfono para verlo en horizontal</div>

<script src="../comun/pantalla.js"></script>
<script src="color.js"></script>
<script src="estado.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const Est = window.Estado, C = window.Color;
  const fx = (n, a) => App.sonido.fx(n, a);
  const stage = $('stage');

  function fit() {
    const vv = window.visualViewport;
    const w = document.documentElement.clientWidth || innerWidth, h = (vv && vv.height) || innerHeight;
    const s = Math.min(w / 915, h / 412);
    stage.style.fontSize = s + 'px'; document.documentElement.style.fontSize = s + 'px';
    stage.style.left = ((w - 915 * s) / 2) + 'px'; stage.style.top = ((h - 412 * s) / 2) + 'px';
  }
  addEventListener('resize', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  const q = new URLSearchParams(location.search);
  const PRACTICA = q.has('practica');
  const DIF = Est.DIFICULTADES[q.get('d')] ? q.get('d') : Est.dificultad;
  const SEGUNDOS = Est.DIFICULTADES[DIF].segundos;
  const RONDAS = 5;
  const INICIO = () => C.inicio(G.objetivo);   // each round, from a random place, far from the color in one or two of the three (#61)

  // the state of the game
  const G = { ronda: 0, objetivo: null, tuyo: { h: 180, s: 50, v: 50 }, resultados: [], usadas: new Set(), timers: [] };
  const fase = f => { stage.dataset.fase = f; };
  const despues = (ms, f) => G.timers.push(setTimeout(f, ms));

  // ------------------------------------------------------------ the strokes and the tubes
  const TUBO = color => `<svg viewBox="0 0 30 60" aria-hidden="true"><defs>
    <linearGradient id="al" x1="0" x2="1"><stop offset="0" stop-color="#8f9399"/><stop offset=".35" stop-color="#eef0f2"/><stop offset=".6" stop-color="#c4c8cd"/><stop offset="1" stop-color="#7d8188"/></linearGradient>
    <linearGradient id="alPlano" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dce0"/><stop offset=".55" stop-color="#c3c7cc"/><stop offset="1" stop-color="#a9adb3"/></linearGradient></defs>
    <rect x="10" y="0" width="10" height="8" rx="1.5" fill="#1e1e1e"/><path d="M12 0V8M14 0V8M16 0V8M18 0V8" stroke="#555" stroke-width=".6"/>
    <rect x="11.5" y="8" width="7" height="3" fill="url(#al)"/><path d="M11.5 11 L6 16 H24 L18.5 11 Z" fill="url(#al)"/>
    <path d="M6 16 H24 L24.6 42 C25.4 46 27 49 28.4 51 H1.6 C3 49 4.6 46 5.4 42 Z" fill="url(#al)"/>
    <path d="M6.1 19 H23.9 V22 H6.1Z" fill="#f6f4ee"/><path class="etiqueta" d="M6.2 22 H23.8 L24.3 39 H5.7 Z" fill="${color}"/>
    <path d="M7.5 43 L4 50.5 M11 44 L9.5 50.5 M19 44 L20.5 50.5 M22.5 43 L26 50.5" stroke="#7d8188" stroke-opacity=".55" stroke-width=".5" fill="none"/>
    <path d="M1.6 51 H28.4 V58.2 L27.6 59 L26.8 58.2 L26 59 L25.2 58.2 L24.4 59 L23.6 58.2 L22.8 59 L22 58.2 L21.2 59 L20.4 58.2 L19.6 59 L18.8 58.2 L18 59 L17.2 58.2 L16.4 59 L15.6 58.2 L14.8 59 L14 58.2 L13.2 59 L12.4 58.2 L11.6 59 L10.8 58.2 L10 59 L9.2 58.2 L8.4 59 L7.6 58.2 L6.8 59 L6 58.2 L5.2 59 L4.4 58.2 L3.6 59 L2.8 58.2 L2 59 L1.6 58.2 Z" fill="url(#alPlano)"/>
    <path d="M1.6 51 H28.4" stroke="#8a8e95" stroke-width=".6"/><path d="M1.8 52 H28.2" stroke="#fff" stroke-opacity=".6" stroke-width=".4"/>
    <path d="M3 54.6 H27" stroke="#9a9ea5" stroke-width=".35" stroke-dasharray=".5 .7"/></svg>`;
  const FILAS = [
    { el: $('filaH'), k: 'h', max: 360 },
    { el: $('filaS'), k: 's', max: 100 },
    { el: $('filaV'), k: 'v', max: 100 },
  ];
  FILAS.forEach((f, i) => { f.trazo = f.el.querySelector('.trazo'); f.grad = f.trazo.querySelector('linearGradient'); f.grad.id = 'grad' + i; f.trazo.querySelector('rect').setAttribute('fill', 'url(#grad' + i + ')'); f.pomo = f.el.querySelector('.pomo'); f.cifra = f.el.querySelector('.cifra'); f.pomo.innerHTML = TUBO('#888'); f.etq = f.pomo.querySelector('.etiqueta'); });
  const ANCHO = 324, IZQ = 22;

  function pintarTuyo() {
    const t = G.tuyo, actual = C.css(t.h, t.s, t.v);
    const tonos = []; for (let h = 0; h <= 360; h += 30) tonos.push(C.css(h, t.s, t.v));
    const pintar = (f, cs) => { f.grad.innerHTML = cs.map((c, i) => `<stop offset="${i / (cs.length - 1)}" stop-color="${c}"/>`).join(''); };
    pintar(FILAS[0], tonos);
    pintar(FILAS[1], [C.css(t.h, 0, t.v), C.css(t.h, 100, t.v)]);
    pintar(FILAS[2], [C.css(t.h, t.s, 0), C.css(t.h, t.s, 100)]);
    FILAS.forEach(f => {
      f.pomo.style.left = (IZQ + t[f.k] / f.max * ANCHO) + 'rem';
      f.etq.setAttribute('fill', actual);
      f.el.setAttribute('aria-valuenow', Math.round(t[f.k]));
    });
    if (stage.dataset.fase === 'armar') $('muestra').style.background = actual;
    $('tuyo').style.background = actual;
    if (PRACTICA) {
      const o = G.objetivo;
      FILAS[0].cifra.textContent = `${Math.round(t.h)}° · referencia ${Math.round(o.h)}°`;
      FILAS[1].cifra.textContent = `${Math.round(t.s)} · referencia ${Math.round(o.s)}`;
      FILAS[2].cifra.textContent = `${Math.round(t.v)} · referencia ${Math.round(o.v)}`;
    } else {
      FILAS[0].cifra.textContent = `${Math.round(t.h)}°`;
      FILAS[1].cifra.textContent = `${Math.round(t.s)}`;
      FILAS[2].cifra.textContent = `${Math.round(t.v)}`;
    }
  }

  // dragging: grabbing the tube moves it from where it is; touching elsewhere on the stroke takes it there
  const activo = () => stage.dataset.fase === 'armar' || stage.dataset.fase === 'practica';
  FILAS.forEach(f => {
    let arrastre = null;
    const valorEn = x => { const r = f.trazo.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * f.max; };
    f.el.addEventListener('pointerdown', e => {
      if (!activo()) return;
      e.preventDefault();
      f.el.setPointerCapture(e.pointerId);
      const rp = f.pomo.getBoundingClientRect(), sobrePomo = e.clientX >= rp.left - 10 && e.clientX <= rp.right + 10;
      if (!sobrePomo) { G.tuyo[f.k] = valorEn(e.clientX); pintarTuyo(); }
      arrastre = { x: e.clientX, v: G.tuyo[f.k], ancho: f.trazo.getBoundingClientRect().width };
      fx('bo_agarra');
    });
    f.el.addEventListener('pointermove', e => {
      if (!arrastre) return;
      G.tuyo[f.k] = Math.max(0, Math.min(f.max, arrastre.v + (e.clientX - arrastre.x) / arrastre.ancho * f.max));
      pintarTuyo();
    });
    const soltar = () => { if (arrastre) { arrastre = null; fx('bo_suelta'); } };
    f.el.addEventListener('pointerup', soltar); f.el.addEventListener('pointercancel', soltar);
    // with a keyboard, the arrows move it a little
    f.el.addEventListener('keydown', e => {
      if (!activo()) return;
      const d = e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowDown' ? -1 : 0;
      if (!d) return;
      e.preventDefault(); G.tuyo[f.k] = Math.max(0, Math.min(f.max, G.tuyo[f.k] + d * (e.shiftKey ? 10 : 1))); pintarTuyo();
    });
  });

  // ------------------------------------------------------------ a round
  function ronda() {
    G.ronda++;
    G.objetivo = C.sortear(G.resultados.map(r => r.objetivo));
    G.tuyo = INICIO();
    $('ronda').textContent = G.ronda + ' / ' + RONDAS;
    $('muestra').classList.add('vacia');
    fase('espera');
    pintarTuyo();
    cuenta(3);
  }
  // 3, 2, 1 on the card, one second each (real time) and with a soft tick, before the color appears; in all five rounds
  function cuenta(n) {
    const c = $('cuenta');
    if (!n) { c.textContent = ''; mirar(); return; }
    c.textContent = n; c.classList.remove('toca'); void c.offsetWidth; c.classList.add('toca');
    despues(1000, () => cuenta(n - 1));
  }
  function mirar() {
    const m = $('muestra'), o = G.objetivo, tiza = $('tiza');
    m.style.background = C.css(o.h, o.s, o.v);
    m.classList.remove('vacia');
    tiza.style.transition = 'none'; tiza.style.transform = 'scaleX(1)';
    fase('mirar');
    void tiza.getBoundingClientRect();
    tiza.style.transition = `transform ${SEGUNDOS}s linear`; tiza.style.transform = 'scaleX(0)';
    despues(SEGUNDOS * 1000, () => {
      m.classList.add('vacia');
      despues(280, armar);
    });
  }
  function armar() {
    fase('armar');
    $('accion').textContent = 'Listo';
    pintarTuyo();
    $('muestra').classList.remove('vacia');
  }
  // the reveal: both colors side by side, the score, a phrase of its band and, if the difference shows, the help
  function ver() {
    const o = G.objetivo, t = Object.assign({}, G.tuyo);
    const dE = C.diferencia(o, t), p = C.puntaje(dE);
    G.resultados.push({ objetivo: o, tuyo: t, dE, p });
    $('orig').style.background = C.css(o.h, o.s, o.v);
    $('tuyo').style.background = C.css(t.h, t.s, t.v);
    $('nro').textContent = C.coma(p);
    $('frase').textContent = C.frase(p, G.usadas);
    const a = C.ayuda(o, t, dE);
    $('ayuda').textContent = a ? a.texto : '';
    const R = Math.round, num = (v, g) => `<span class="n"><b>${R(v)}${g ? '<i>°</i>' : ''}</b></span>`;
    $('desglose').innerHTML = '<div class="tabla"><span class="tit"></span><span class="tit">Referencia</span><span class="tit">Tu intento</span>' +
      [['tono', 'h', 1], ['saturación', 's', 0], ['brillo', 'v', 0]].map(([n, k, g]) => `<span>${n}</span>${num(o[k], g)}${num(t[k], g)}`).join('') + '</div>';
    $('accion').textContent = G.ronda < RONDAS ? 'Siguiente' : 'Ver el total';
    fase('ver');
    ajustarNota();
    fx('bo_pincel');
  }
  // a long phrase plus the help and the table can overflow the sheet: the phrase and the help get a little smaller until it fits
  function ajustarNota() {
    const caja = document.querySelector('#nota .textos'), els = [$('frase'), $('ayuda')], base = [27, 17];   // the table keeps its size
    for (let k = 0; k <= 6; k++) {
      const f = 1 - k * 0.06;
      els.forEach((el, i) => { el.style.fontSize = base[i] * f + 'rem'; el.style.lineHeight = base[i] * 1.32 * f + 'rem'; });
      if (caja.scrollHeight <= caja.clientHeight + 1) break;
    }
  }
  function fin() {
    const total = Math.round(G.resultados.reduce((s, r) => s + r.p, 0) * 10) / 10;
    const r = Est.terminada(DIF, total);
    $('finDif').textContent = 'PARTIDA · ' + Est.DIFICULTADES[DIF].nombre.toUpperCase();
    $('total').innerHTML = `${C.coma(total)}<small> de 50</small>`;
    $('sello').hidden = !r.record;
    $('antes').textContent = r.record && r.antes ? 'antes: ' + C.coma(r.antes) : r.record ? '' : 'récord: ' + C.coma(r.antes);
    const ROT = [-2, 1.5, -1, 2, -1.5];
    $('fichas').innerHTML = G.resultados.map((x, i) =>
      `<div class="ficha" style="--r:${ROT[i]}deg"><div><i style="background:${C.css(x.objetivo.h, x.objetivo.s, x.objetivo.v)}"></i><i style="background:${C.css(x.tuyo.h, x.tuyo.s, x.tuyo.v)}"></i></div><b>${C.coma(x.p)}</b></div>`).join('');
    $('fin').hidden = false;
    fase('fin');
    App.sonido.duck(true);   // the music goes down so the end is heard, as at the end of a level in Fogonazo
    fx(r.record ? 'bo_record' : 'bo_fin');
  }
  function nuevaPartida() {
    G.timers.forEach(clearTimeout); G.timers = [];
    G.ronda = 0; G.resultados = []; G.usadas = new Set();
    $('fin').hidden = true;
    App.sonido.duck(false);
    ronda();
  }

  // ------------------------------------------------------------ the practice: the color stays in view, with numbers
  function practica() {
    G.objetivo = C.sortear(G.objetivo ? [G.objetivo] : []);
    G.tuyo = INICIO();
    $('ronda').textContent = 'práctica';
    $('ronda').style.width = '100rem'; $('ronda').style.left = '213rem';
    $('orig').style.background = C.css(G.objetivo.h, G.objetivo.s, G.objetivo.v);
    $('accion').textContent = 'Otro color';
    fase('practica');
    pintarTuyo();
  }

  $('accion').addEventListener('click', () => {
    const f = stage.dataset.fase;
    fx('bo_cinta');
    if (f === 'armar') ver();
    else if (f === 'ver') { if (G.ronda < RONDAS) ronda(); else fin(); }
    else if (f === 'practica') practica();
  });
  $('otra').addEventListener('click', () => { fx('bo_cinta'); nuevaPartida(); });
  $('volver').addEventListener('click', () => { fx('bo_cinta'); App.volver(1 + App.extra); });

  // for the tools (herramientas/capturas.js): see the state and jump to a moment
  window.__buenojo = { G, fase: () => stage.dataset.fase, ver, fin, armar, ronda, poner: t => { Object.assign(G.tuyo, t); pintarTuyo(); }, objetivo: o => { G.objetivo = o; } };

  if (PRACTICA) practica(); else ronda();
})();
</script>
</body>
