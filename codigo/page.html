<title>Fogonazo</title>
<style>
/* ================================================================================================
   GUÍA DE ESTILO DE FOGONAZO
   Las reglas vigentes de interfaz, dibujos, sonido y música. Por qué se decidió cada una y qué se
   descartó está en docs/decisiones.md; las reglas del juego, en docs/manifiesto.md.

   Metáfora
   - Banco de trabajo de electrónica: tapete antiestático gris azulado con grilla de fondo, la placa
     PCB verde en el centro e instrumentos en el tablero. Movimientos en un display de 7 segmentos
     rojo, puntos en un display fluorescente (VFD) verde agua y el avance de estrellas en un vúmetro
     de LEDs. Tema oscuro único, a propósito: no hay modo claro.
   - Pensado para el celular, en vertical.
   - Funciona sin conexión: todo queda guardado en el teléfono (sw.js), también las tipografías
     (herramientas/fuentes.js).

   Dos consolas: 8 bits (por defecto, no se saca) y 16 bits
   - El selector «Gráficos: 8 bits / 16 bits» está en los Ajustes del mapa y en la pausa, y se guarda.
     Cambia todo: dibujos, interfaz, tipografía, música y efectos. Todo cambio se resuelve en las dos.
   - Dibujos: 8 bits, 16×16 con contorno negro y colores planos (sprites.js); 16 bits, 32×32 con luz
     desde arriba a la izquierda, brillo, tramado y contorno de color (sprites16.js).
   - Placa: 8 bits, celdas planas; 16 bits, degradé, pistas de cobre en las calles y vías doradas.
   - Títulos: 8 bits, Silkscreen; 16 bits, Jersey 25 con relleno metálico (dorado el logo, plateado
     el resto). Textos y botones: 8 bits, Pixelify Sans y Silkscreen; 16 bits, Jersey 15.
   - Paneles y menús: 8 bits, planos con borde; 16 bits, bisel, tornillos en las esquinas y vidrio
     sobre los displays. Botones: cobre plano en 8 bits, cromados con relieve en 16.
   - Mapa: placas verdes con pads de cobre; en 16 bits, con textura de pistas y pads con volumen,
     plateados al completarlos.
   - Transiciones: ninguna en 8 bits; en 16, mosaico de medio segundo al empezar cada nivel.
   - El cartel de fin de nivel lleva siempre su panel de fondo, también en 16 bits.

   Detalles
   - El contador de estrellas va en una fila propia bajo el título, con su barra de avance.
   - Sin ligaduras tipográficas (Pixelify Sans une «fi» y «fl» en un signo que parece una «A»).
   - «★», «▶» y «✓» son dibujos pixelados propios (las fuentes no los traen).
   - Ícono del juego: el LED de 16 bits con un destello detrás, sobre la placa verde.

   Sonido y música (audio.js): todo se sintetiza en el navegador, sin archivos de audio
   - Tres temas, cada uno con dos arreglos de las mismas notas: Placa (el original; niveles por
     movimientos; la menor, Am F C G, 104 ppm), Taller (mapa; do mayor, C G Am F, arpegio a
     corcheas, 92 ppm) y Urgente (contrarreloj; la menor con final en mi mayor, Am F Dm E, 144 ppm).
   - 8 bits: los instrumentos del tema original (bajo cuadrado, arpegio triangular, hi-hats de
     ruido y melodía cuadrada, que entra cada dos vueltas en Placa y Taller).
   - 16 bits: FM tipo Genesis (bajo slap, melodía tipo bronce, arpegio que alterna entre parlantes,
     eco corto), pasada por una etapa que satura y baja la resolución. Va al 60 % del bus de música.
   - Sonido de línea: el original en 8 bits; «Bip» (dos pulsos FM cortos) en 16.
   - Los efectos de 16 bits están nivelados con los de 8. La música baja al terminar un nivel para
     que se escuche la fanfarria. Volúmenes por defecto: efectos 70, música 35; «Silenciar todo».

   Versión instalable (0.1.0)
   - Tarjeta «Instalá Fogonazo en tu teléfono», solo en el navegador (no desde el ícono ni en la vista previa
     de claude.ai), arriba del bloque del nivel actual: ícono, título, «Queda entre tus apps y funciona sin
     conexión.» e «Instalar». Abre el cuadro de Chrome si ya está disponible; si no, la ventana «Instalar
     Fogonazo» con los dos pasos del menú ⋮ (o los de Safari en iPhone). En Samsung Internet, la ventana
     ofrece «Abrir en Chrome». Instalado, la tarjeta pasa a «Listo», con borde verde.
   - Versión: última fila de Ajustes antes de «Listo», con su número y su fecha. Al día, «Buscar»; con una
     nueva, LED verde «Hay una versión nueva» y «Actualizar» (cobre, el principal), que reabre el juego y avisa
     «Listo». Mientras haya una nueva, un LED verde en el engranaje del mapa. Verde: el color de lo nuevo.
   - Avisos breves (toast) abajo, en un panel como los del tablero.
   - En 16 bits, Jersey no tiene negrita: lo destacado va en blanco, sin negrita sintética.

   Textos
   - Amenos, en voseo rioplatense, sin errores ni redundancias y técnicamente correctos.
   ================================================================================================ */
/* Tipografías locales (herramientas/fuentes.js), para que el juego funcione sin conexión.
   La vista previa de claude.ai las lleva adentro del archivo (herramientas/vista_previa.js). */
@font-face { font-family: 'Silkscreen'; font-weight: 400; font-display: swap; src: url(fuentes/silkscreen-400.woff2) format('woff2'); }
@font-face { font-family: 'Silkscreen'; font-weight: 700; font-display: swap; src: url(fuentes/silkscreen-700.woff2) format('woff2'); }
@font-face { font-family: 'Pixelify Sans'; font-weight: 400; font-display: swap; src: url(fuentes/pixelify-sans-400.woff2) format('woff2'); }
@font-face { font-family: 'Pixelify Sans'; font-weight: 600; font-display: swap; src: url(fuentes/pixelify-sans-600.woff2) format('woff2'); }
@font-face { font-family: 'Jersey 15'; font-weight: 400; font-display: swap; src: url(fuentes/jersey-15-400.woff2) format('woff2'); }
@font-face { font-family: 'Jersey 25'; font-weight: 400; font-display: swap; src: url(fuentes/jersey-25-400.woff2) format('woff2'); }
:root {
  --mat: #1a252d;
  --mat-line: #22303a;
  --panel: #0e1519;
  --panel-2: #141e24;
  --edge: #2b3a44;
  --pcb: #0f4a31;
  --pcb-dark: #0a3423;
  --silk: #edf3ef;
  --muted: #8ea2ab;
  --copper: #e08a3c;
  --copper-hi: #f7b77c;
  --copper-lo: #9c5520;
  --solder: #c9d1d9;
  --led: #ff3d2e;
  --led-off: #3a1714;
  --vfd: #4ef2c9;
  --vfd-off: #12332c;
  --amber: #ffbf2e;
  --ok: #3ee07a;
  --font-display: 'Silkscreen', 'Courier New', monospace;
  --font-ui: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--silk);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
}
button, input, h1, h2, h3, p, span, b, label, output { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0, "dlig" 0; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
#app { height: 100%; max-width: 520px; margin: 0 auto; position: relative; user-select: none; -webkit-user-select: none; }
.screen { height: 100%; display: flex; flex-direction: column; }
.pixel-icon { image-rendering: pixelated; display: block; }

/* ---------- botones */
.btn {
  font-family: var(--font-ui); font-size: 15px; letter-spacing: .04em; text-transform: uppercase;
  border: 0; border-radius: 4px; padding: 12px 16px; min-height: 46px; cursor: pointer;
  background: var(--copper); color: #2a1406;
  box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -4px 0 var(--copper-lo), 0 2px 0 #000a;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -2px 0 var(--copper-lo); }
.btn.ghost { background: var(--panel-2); color: var(--silk); box-shadow: inset 0 0 0 2px var(--edge), 0 2px 0 #000a; }
.btn.ghost:active { box-shadow: inset 0 0 0 2px var(--edge); }
.btn.danger { background: #c0392b; color: #fff; box-shadow: inset 0 2px 0 #e86a5c, inset 0 -4px 0 #7d1d13; }
.btn:focus-visible, .icon-btn:focus-visible, .node:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 4px; border: 0; cursor: pointer; flex: none;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge); display: grid; place-items: center; color: var(--silk);
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--panel-2); }

/* ---------- mapa */
#scr-map { overflow-y: auto; padding: 14px 16px 28px; gap: 14px; }
.map-head { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: min(30px, 8.2vw); margin: 0; letter-spacing: .02em; line-height: 1; text-shadow: 3px 3px 0 #000; white-space: nowrap; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.prog { flex: 1; min-width: 0; display: flex; gap: 2px; height: 12px; }
.prog i { flex: 1; border-radius: 1px; background: #16241c; }
.prog i.lit { background: var(--amber); box-shadow: 0 0 4px #ffbf2e88; }
.led-dot { width: 12px; height: 12px; border-radius: 2px; background: var(--led); box-shadow: 0 0 10px var(--led); animation: blink 1.6s steps(1) infinite; flex: none; }
@keyframes blink { 50% { background: var(--led-off); box-shadow: none; } }
.star-total { font-family: var(--font-ui); font-size: 14px; display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 6px 10px; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--edge); height: 36px; flex: none; }
.tagline { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
.block {
  background: var(--pcb); border-radius: 8px; padding: 12px 12px 14px; position: relative;
  box-shadow: inset 0 0 0 2px var(--pcb-dark), 0 3px 0 #0006;
  background-image: radial-gradient(circle at 10px 10px, #c9a24a 0 3px, var(--pcb-dark) 3px 4.5px, transparent 5px), radial-gradient(circle at calc(100% - 10px) 10px, #c9a24a 0 3px, var(--pcb-dark) 3px 4.5px, transparent 5px);
}
.block.locked { filter: saturate(.35) brightness(.75); }
.block-head { display: flex; align-items: baseline; gap: 8px; padding: 0 16px; flex-wrap: wrap; }
.block-head .ref { font-family: var(--font-ui); font-size: 11px; color: #bfe5cf; opacity: .8; }
.block-head h2 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.block-head .desc { font-size: 14px; color: #a9d6bd; }
.nodes { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; }
.nodes::before { content: ''; position: absolute; left: 10%; right: 10%; top: 25px; height: 6px; background: var(--copper-lo); border-radius: 3px; box-shadow: inset 0 2px 0 #c7783a; }
.node {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: 0; padding: 0; cursor: pointer;
}
.node .pad {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
  background: radial-gradient(circle, #0b2118 0 15px, var(--copper) 16px 21px, var(--copper-lo) 22px 25px, transparent 26px);
  font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--silk);
}
.node.done .pad { background: radial-gradient(circle, #0b2118 0 15px, #dfe5ea 16px 19px, #9aa4ae 20px 25px, transparent 26px); }
.node.locked .pad { background: radial-gradient(circle, #0b2a1d 0 15px, #2f5a45 16px 25px, transparent 26px); color: #5f8a75; }
.node.current .pad::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 3px var(--amber), 0 0 16px var(--amber); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.node .badge { position: absolute; top: -4px; right: calc(50% - 32px); z-index: 2; width: 20px; height: 20px; border-radius: 3px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--amber); display: grid; place-items: center; }
.node .badge svg { width: 14px; height: 14px; }
.node .stars { display: flex; gap: 2px; height: 12px; }
.node .stars svg { width: 12px; height: 12px; }
.help-link { align-self: center; }

/* ---------- juego */
#scr-game { padding: 8px 12px 10px; gap: 8px; }
.game-head { display: flex; align-items: center; gap: 10px; }
.lvl-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.lvl-title .num { font-family: var(--font-ui); font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.lvl-title .name { font-family: var(--font-display); font-size: 16px; font-weight: 700; text-transform: uppercase; text-align: center; text-wrap: balance; max-width: 100%; line-height: 1.05; }
.lvl-title .name.long { font-size: 13px; }
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: stretch; }
.meter { background: var(--panel); border-radius: 5px; padding: 5px 8px 6px; box-shadow: inset 0 0 0 2px var(--edge), inset 0 3px 8px #000c; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.meter label { font-family: var(--font-ui); font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.seg { display: flex; gap: 2px; height: 30px; }
.seg svg { height: 100%; width: auto; overflow: visible; }
.seg .on { fill: var(--led); filter: drop-shadow(0 0 3px #ff3d2e99); }
.seg .off { fill: var(--led-off); }
.seg.vfd .on { fill: var(--vfd); filter: drop-shadow(0 0 3px #4ef2c999); }
.seg.vfd .off { fill: var(--vfd-off); }
.seg.warn .on { animation: blink .5s steps(1) infinite; }
.vu-wrap { background: var(--panel); border-radius: 5px; padding: 6px 8px; box-shadow: inset 0 0 0 2px var(--edge), inset 0 3px 8px #000c; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
.vu-stars { position: relative; height: 14px; }
.vu-stars svg { position: absolute; top: 0; width: 14px; height: 14px; transform: translateX(-50%); }
.vu { display: flex; gap: 2px; height: 14px; }
.vu i { flex: 1; border-radius: 1px; background: #16241c; }
.vu i.y { background: #2c2610; }
.vu i.r { background: #2d1210; }
.vu i.lit { background: var(--ok); box-shadow: 0 0 5px #3ee07aaa; }
.vu i.y.lit { background: var(--amber); box-shadow: 0 0 5px #ffbf2eaa; }
.vu i.r.lit { background: var(--led); box-shadow: 0 0 5px #ff3d2eaa; }
.goals { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 44px; }
.goal { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 5px; padding: 4px 10px 4px 6px; box-shadow: inset 0 0 0 2px var(--edge); }
.goal canvas { width: 32px; height: 32px; }
.goal .cnt { font-family: var(--font-display); font-size: 18px; font-weight: 700; min-width: 2ch; text-align: right; }
.goal .lbl { font-size: 13px; color: var(--muted); }
.goal.done { box-shadow: inset 0 0 0 2px var(--ok); }
.goal.done .cnt { color: var(--ok); }
.goal.bump { animation: bump .25s ease-out; }
@keyframes bump { 40% { transform: scale(1.12); } }
.board-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; padding-top: 2px; }
.board-frame { position: relative; padding: 7px; border-radius: 9px; background: var(--pcb-dark); box-shadow: 0 0 0 2px #06231a, 0 6px 0 #0008; }
.board-frame::before, .board-frame::after { content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #c9a24a; box-shadow: 0 0 0 2px #06231a; top: -2px; }
.board-frame::before { left: -2px; }
.board-frame::after { right: -2px; }
#board { display: block; touch-action: none; border-radius: 3px; image-rendering: pixelated; }
.banner {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
  font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; text-align: center;
  background: var(--panel); padding: 12px 18px; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--amber), 0 6px 0 #0009;
  color: var(--amber); max-width: 90%; text-wrap: balance; animation: bannerIn .25s ease-out;
}
@keyframes bannerIn { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
.tip-strip { font-size: 14px; color: var(--muted); text-align: center; min-height: 18px; line-height: 1.25; }

/* ---------- modales */
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: #050a0dcc; }
.card {
  width: 100%; max-width: 380px; max-height: calc(100% - 8px); overflow-y: auto; border-radius: 8px; padding: 18px 16px 16px;
  background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge), 0 10px 0 #000a; display: flex; flex-direction: column; gap: 12px;
  animation: cardIn .2s ease-out;
}
@keyframes cardIn { from { transform: translateY(16px); opacity: 0; } }
.card .eyebrow { font-family: var(--font-ui); font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 0; text-transform: uppercase; text-wrap: balance; line-height: 1.1; }
.card p { margin: 0; line-height: 1.4; color: #c9d6dc; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.card .row > .btn { flex: 1 1 120px; }
.card .stack { display: flex; flex-direction: column; gap: 8px; }
.spec { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 5px; padding: 8px 10px; }
.spec .k { font-family: var(--font-ui); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.spec .v { font-family: var(--font-ui); font-size: 16px; }
.order { display: flex; flex-direction: column; gap: 6px; }
.order-item { display: flex; align-items: center; gap: 10px; }
.order-item canvas { width: 36px; height: 36px; flex: none; }
.newbox { display: flex; gap: 12px; align-items: center; background: #2a2208; border-radius: 6px; padding: 10px 12px; box-shadow: inset 0 0 0 2px #6b5410; }
.newbox canvas { width: 48px; height: 48px; flex: none; }
.newbox .t { font-size: 15px; line-height: 1.35; color: #f3e6c0; }
.newbox .t b { font-family: var(--font-ui); font-size: 12px; color: var(--amber); display: block; margin-bottom: 2px; letter-spacing: .06em; }
.bigstars { display: flex; justify-content: center; gap: 10px; padding: 4px 0; }
.bigstars svg { width: 52px; height: 52px; transition: transform .2s; }
.bigstars svg.pop { animation: starPop .35s ease-out; }
@keyframes starPop { 0% { transform: scale(.3); } 70% { transform: scale(1.25); } }
.score-line { display: flex; justify-content: space-between; font-family: var(--font-ui); font-size: 15px; }
.score-line .rec { color: var(--amber); }
.fader { display: grid; grid-template-columns: 74px 1fr 42px; gap: 10px; align-items: center; }
.fader label { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.fader output { font-family: var(--font-ui); font-size: 13px; text-align: right; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #05090b; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--edge); }
input[type=range]::-moz-range-track { height: 6px; background: #05090b; border-radius: 3px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 30px; margin-top: -12px; border-radius: 3px; background: var(--copper); box-shadow: inset 0 -4px 0 var(--copper-lo), inset 0 2px 0 var(--copper-hi); }
input[type=range]::-moz-range-thumb { width: 18px; height: 30px; border-radius: 3px; border: 0; background: var(--copper); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel-2); border-radius: 5px; padding: 8px 10px; cursor: pointer; border: 0; width: 100%; text-align: left; }
.toggle .lbl { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.toggle .sw { width: 46px; height: 24px; border-radius: 3px; background: #05090b; box-shadow: inset 0 0 0 2px var(--edge); position: relative; flex: none; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 2px; background: #56636b; transition: left .15s; }
.stylepick { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: center; background: var(--panel-2); border-radius: 5px; padding: 6px 8px; }
.stylepick .lbl { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-right: 4px; }
.stylepick button { font-family: var(--font-ui); font-size: 13px; border: 0; border-radius: 3px; min-height: 40px; cursor: pointer; background: #05090b; color: var(--muted); box-shadow: inset 0 0 0 2px var(--edge); }
.stylepick button[aria-pressed=true] { background: var(--copper); color: #2a1406; box-shadow: inset 0 2px 0 var(--copper-hi), inset 0 -3px 0 var(--copper-lo); }
.toggle[aria-pressed=true] .sw::after { left: 25px; background: var(--led); box-shadow: 0 0 8px var(--led); }
.legend { display: flex; flex-direction: column; gap: 8px; }

/* =====================================================================

   botones cromados, títulos con relleno metálico, vidrio sobre los displays.
   ===================================================================== */
html[data-art="16"] {
  --font-display: 'Jersey 25', 'Arial Narrow', sans-serif;

}

html[data-art="16"] .spec .k, html[data-art="16"] .fader label, html[data-art="16"] .toggle .lbl, html[data-art="16"] .stylepick .lbl { font-size: 17px; }

}
/* mapa: placas con pistas y vías */
html[data-art="16"] .block {
  border-radius: 10px;

    radial-gradient(circle at 11px 11px, #ffe7a3 0 2px, #c9a24a 2.5px 3.5px, #3a2c0c 4px 5px, transparent 5.5px),

/* ---------------- versión instalable: tarjeta «Instalar», ventana de instalación, versión y avisos */
.inst {

  background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge), 0 3px 0 #0006;
}

/* Modo zen (B-07): la tarjeta va arriba del mapa, como la pantalla de un osciloscopio */
.zen {

  background: #071612; box-shadow: inset 0 0 0 2px #1d4a40, 0 3px 0 #0006;
  background-image: linear-gradient(#4ef2c912 1px, transparent 1px), linear-gradient(90deg, #4ef2c912 1px, transparent 1px);
  background-size: 18px 18px; background-position: -1px -1px;
}
.zen-wave { position: absolute; left: 0; right: 0; top: 4px; height: 40px; opacity: .3; pointer-events: none; }
.zen-wave path { fill: none; stroke: var(--vfd); stroke-width: 2; filter: drop-shadow(0 0 3px var(--vfd)); }
.zen-top { position: relative; display: flex; align-items: center; gap: 10px; }

.zen-top h2 { margin: 0; font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; color: var(--vfd); text-shadow: 0 0 8px #4ef2c966, 2px 2px 0 #000; }

.zen-rec div { flex: 1; display: flex; flex-direction: column; gap: 2px; background: #03100c; border-radius: 4px; padding: 6px 8px; box-shadow: inset 0 0 0 2px #143a31; }
.zen-rec .k { font-family: var(--font-ui); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #6fa597; }
.zen-rec .v { font-family: var(--font-display); font-size: 16px; color: var(--vfd); }
.goal.opt { background: transparent; box-shadow: inset 0 0 0 2px #2b3a44; outline: 2px dashed #4ef2c955; outline-offset: -2px; }
