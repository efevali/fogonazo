<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Biblioteca · la entrada</title>
<link rel="stylesheet" href="mueble.css">
<style>
/* The way into Biblioteca (S-37d): the top of the low bookcase up close, with the mushroom lamp on the right, the
   Swiss cheese plant on the left and, on the cabinet, three books that pick the difficulty (the thicker, the harder;
   the chosen one lifted, with an amber edge), an alarm clock and a camera. On the wall, a loan card pinned with the
   title (S-37h: it comes in shuffled and sorts itself out), the difficulty, its record and «Jugar». */
#escena { left: 0; top: 0; width: 915rem; height: 412rem; pointer-events: none; }
#escena svg { width: 100%; height: 100%; display: block; }
/* the three books, standing on the cabinet */
#libros { left: 0; top: 0; width: 915rem; height: 412rem; pointer-events: none; z-index: 2; }
.libro { position: absolute; bottom: 108rem; display: flex; align-items: center; justify-content: center; border-radius: 1.5rem 1.5rem 0 0;
  box-shadow: inset -3rem 0 0 rgba(0, 0, 0, .18), inset 2rem 0 0 rgba(255, 255, 255, .08), 0 2rem 4rem rgba(0, 0, 0, .3); transition: transform .15s, box-shadow .15s; pointer-events: auto; }
.libro::before, .libro::after { content: ''; position: absolute; left: 0; right: 0; height: 2.5rem; background: #d8b04a; }
.libro::before { top: 10rem; } .libro::after { bottom: 10rem; }
.libro span { transform: rotate(-90deg); font: 700 11.5rem Barlow; letter-spacing: .14em; color: #f4ead2; white-space: nowrap; }
.libro.elegido { transform: translateY(-9rem); box-shadow: 0 0 0 2.5rem var(--ambar), inset -3rem 0 0 rgba(0, 0, 0, .18), 0 10rem 12rem rgba(0, 0, 0, .3); }

#ficha { left: 387rem; top: 13rem; width: 303rem; height: 245rem; transform: rotate(.8deg); z-index: 3; }
#ficha .chinche { left: 149rem; top: 3rem; }
#titulo { left: 30rem; top: 34rem; width: 245rem; height: 58rem; }
#titulo span { position: absolute; top: 6rem; font: 600 37rem/1 Fraunces, Georgia, serif; font-variation-settings: "SOFT" 30; color: #2a201a; white-space: nowrap; transform-origin: 50% 80%; }
#flechas { position: absolute; left: 0; top: -14rem; width: 245rem; height: 86rem; overflow: visible; }
#flechas path { fill: none; stroke: #c0392b; stroke-width: 1.8; stroke-linecap: round; }
#ficha .rotulo { left: 26rem; }
.valor { left: 26rem; font-size: 17rem; line-height: 20rem; white-space: nowrap; }
#ficha .renglon { left: 26rem; width: 252rem; }
#jugar { left: 177rem; top: 203rem; width: 100rem; height: 30rem; font-size: 16rem; }
</style>
</head>

    </defs>

      <path d="M104 172 C60 170 34 130 44 84 C52 46 92 20 134 26 C176 32 198 72 186 112 C176 146 142 172 104 172 Z"/>

      <path d="M22 292 C-14 286 -36 248 -26 208 C-16 172 22 154 56 168 C90 182 96 222 80 254 C68 280 46 294 22 292 Z"/>
      <path d="M196 264 C176 240 180 206 206 194 C232 182 260 198 262 226 C264 252 240 270 216 270 Z"/>
      <path d="M8 412 C-10 390 -10 350 14 336 C40 322 66 340 66 368 C66 392 40 412 8 412 Z"/>
    </g>
    <g stroke="#e9dcb8" stroke-width="3.6" stroke-linecap="round" opacity=".9">
      <path d="M58 72 L80 92 M48 110 L76 116 M70 150 L92 136 M150 40 L136 66 M182 92 L156 100 M170 138 L148 126"/>
      <path d="M236 62 L246 86 M290 70 L270 92 M296 124 L272 120 M258 152 L252 128"/>
      <path d="M-6 220 L18 228 M8 270 L30 254 M70 196 L46 214 M74 248 L50 240"/>
      <path d="M190 228 L210 230 M218 196 L222 216 M254 220 L234 228"/>
    </g>
    <path d="M104 172 L130 40 M244 160 L270 64 M22 292 L40 180" stroke="#2c5e33" stroke-width="1.6" fill="none"/>
    <!-- the cabinet: the top and two dark openings below -->
    <rect x="150" y="304" width="780" height="36" fill="url(#tapa)"/>
    <rect x="150" y="304" width="780" height="2" fill="#f6dcb0"/>
    <rect x="150" y="338" width="780" height="80" fill="#c08c52"/>
    <rect x="170" y="340" width="300" height="80" fill="url(#hueco)"/>
    <rect x="484" y="340" width="330" height="80" fill="url(#hueco)"/>
    <rect x="150" y="338" width="780" height="3" fill="rgba(0,0,0,.18)"/>
    <!-- the alarm clock -->
    <g transform="translate(357 252) scale(.68)">
      <path d="M19 66 L12 77 M41 66 L48 77" stroke="#7a5a2a" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="16" cy="22" r="8.5" fill="#c9a55a"/><circle cx="44" cy="22" r="8.5" fill="#c9a55a"/><rect x="27.5" y="15" width="5" height="7" fill="#8a6c3a"/>
      <circle cx="30" cy="46" r="21" fill="#2aa198"/><circle cx="30" cy="46" r="16" fill="#f4ecd8"/>
      <path d="M30 46 V35 M30 46 L37 50" stroke="#222" stroke-width="2.4" stroke-linecap="round"/><circle cx="30" cy="46" r="1.7" fill="#c0392b"/>
    </g>
    <!-- the camera, a little turned -->
    <g transform="translate(632 262) rotate(-6 25 25)">
      <rect x="8" y="6" width="11" height="6" rx="1" fill="#9a9a96"/><circle cx="37" cy="8" r="3" fill="#8a8a86"/>
      <rect x="0" y="10" width="50" height="34" rx="3.5" fill="#1d1a19"/><rect x="0" y="10" width="50" height="9" rx="2.5" fill="#d6d6d2"/>
      <circle cx="25" cy="29" r="12" fill="#9a9a96"/><circle cx="25" cy="29" r="9" fill="#1f2e3e"/><circle cx="25" cy="29" r="5" fill="#2e4a66"/><circle cx="22" cy="26" r="2" fill="#fff" opacity=".45"/>
    </g>
    <ellipse cx="658" cy="309" rx="26" ry="3" fill="rgba(0,0,0,.25)"/>
    <!-- the mushroom lamp, lit -->
    <ellipse cx="791" cy="300" rx="34" ry="7" fill="rgba(0,0,0,.25)"/>
    <ellipse cx="791" cy="294" rx="31" ry="9" fill="url(#pie)"/>
    <rect x="783" y="205" width="16" height="90" fill="url(#pie)"/>
    <path d="M712 210 C712 168 748 150 790 150 C832 150 869 168 869 210 C869 214 866 216 862 216 H719 C715 216 712 214 712 210 Z" fill="url(#pantalla)"/>
    <ellipse cx="790" cy="214" rx="72" ry="5" fill="#fff1c8" opacity=".9"/>
    <ellipse cx="770" cy="170" rx="28" ry="7" fill="#fff" opacity=".18"/>
  </svg></div>

  <div id="libros" role="radiogroup" aria-label="Dificultad"></div>

  <div id="ficha" class="ficha">
    <span class="chinche"></span>
    <div id="titulo" aria-label="Biblioteca"><svg id="flechas" viewBox="0 0 245 86" aria-hidden="true"></svg></div>
    <div class="rotulo" style="top:105rem">DIFICULTAD</div><div id="vDif" class="maquina valor" style="top:117rem"></div>
    <div class="renglon" style="top:142rem"></div>
    <div class="rotulo" style="top:152rem">RÉCORD</div><div id="vRec" class="maquina valor" style="top:164rem"></div>
    <div class="renglon" style="top:189rem"></div>
    <button id="jugar" class="boton principal" type="button">Jugar</button>
  </div>
  <button id="volver" type="button" aria-label="Volver a la sala"><svg viewBox="0 0 132 34" aria-hidden="true"><path d="M2,4 h126 l-4,13 l4,13 h-126 l4,-13 z" fill="#1c1c1c"/><text x="66" y="23" text-anchor="middle" font-family="Barlow" font-weight="700" font-size="14" letter-spacing="2.2" fill="#f4f1ea">◀ VOLVER</text></svg></button>
</div>
<div id="rotate">Girá el teléfono para verlo en horizontal</div>

<script src="../comun/pantalla.js"></script>
<script src="repartos.js"></script>
<script src="estado.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const Est = window.Estado, R = window.Repartos;

  const stage = $('stage');
  function fit() {
    const vv = window.visualViewport;
    const w = document.documentElement.clientWidth || innerWidth, h = (vv && vv.height) || innerHeight;
    const s = Math.min(w / 915, h / 412);
    stage.style.fontSize = s + 'px'; document.documentElement.style.fontSize = s + 'px';
    stage.style.left = ((w - 915 * s) / 2) + 'px'; stage.style.top = ((h - 412 * s) / 2) + 'px';
  }
  addEventListener('resize', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  // the three books: the thicker, the harder
  const LIBROS = {
    facil: { x: 196, w: 30, h: 96, color: '#2f6b4a' },
    normal: { x: 229, w: 42, h: 110, color: '#2c5a96' },
    dificil: { x: 274, w: 55, h: 124, color: '#7c1f2c' },
  };
  function pintar() {
    const d = Est.dificultad;
    $('libros').innerHTML = Object.entries(LIBROS).map(([id, b]) =>
      `<button class="libro${id === d ? ' elegido' : ''}" type="button" role="radio" aria-checked="${id === d}" data-id="${id}"
        style="left:${b.x}rem;width:${b.w}rem;height:${b.h}rem;background:${b.color}"><span>${R.DIFICULTADES[id].nombre.toUpperCase()}</span></button>`).join('');
    $('vDif').textContent = R.DIFICULTADES[d].nombre;
    const r = Est.record(d);
    $('vRec').textContent = r ? `${r.movidas} movidas · ${Est.reloj(r.tiempo)}` : 'todavía no hay';
  }
  pintar();
  $('libros').addEventListener('click', e => {
    const b = e.target.closest('.libro'); if (!b || b.dataset.id === Est.dificultad) return;
    Est.dificultad = b.dataset.id; pintar();
  });
  $('jugar').addEventListener('click', () => App.ir('biblioteca/partida.html?d=' + Est.dificultad, 1));
  $('volver').addEventListener('click', () => App.volver(1 + App.extra));

  // ------------------------------------------------------------ the title (S-37h)
  // «BIBLIOTECA» comes in shuffled, «BLIO BI CA TE», with red arrows that say where each syllable goes, and sorts
  // itself out in about four seconds: BI jumps over BLIO, TE and CA swap. The syllables stay a little crooked.
  const titulo = $('titulo'), SIL = ['BI', 'BLIO', 'TE', 'CA'], DESORDEN = ['BLIO', 'BI', 'CA', 'TE'];
  const TORCIDO = { BI: { r: -3, y: -3 }, BLIO: { r: 1, y: 2 }, TE: { r: -1.5, y: 0 }, CA: { r: 2.5, y: 3 } };
  const span = {};
  SIL.forEach(s => { const e = document.createElement('span'); e.textContent = s; titulo.appendChild(e); span[s] = e; });
  function armar() {
    const ancho = s => span[s].getBoundingClientRect().width / (parseFloat(document.documentElement.style.fontSize) || 1);
    const W = titulo.clientWidth || 245, GAP = 1.5;
    const pos = orden => { const tot = orden.reduce((t, s) => t + ancho(s), 0) + GAP * (orden.length - 1); let x = (W - tot) / 2; const p = {}; orden.forEach(s => { p[s] = x; x += ancho(s) + GAP; }); return p; };
    const fin = pos(SIL), ini = pos(DESORDEN);
    const t = (s, x, y = 0, r = 0) => `translate(${x}rem, ${y}rem) rotate(${r}deg)`;
    const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
    SIL.forEach(s => { const k = TORCIDO[s]; span[s].style.left = '0'; span[s].style.transform = t(s, quieto ? fin[s] : ini[s], quieto ? k.y : 0, quieto ? k.r : 0); });
    if (quieto) return;
    // the arrows: over BLIO from BI to the start; under, BLIO to the right; the same for TE and CA
    const c = s => (ini[s] + ancho(s) / 2), arco = (x1, x2, arriba) => {
      const y = arriba ? 12 : 66, cy = arriba ? -2 : 80, dir = x2 > x1 ? -1 : 1;
      return `<path d="M${x1} ${y} Q${(x1 + x2) / 2} ${cy} ${x2} ${y}"/><path d="M${x2 + dir * 6} ${y + (arriba ? -4 : 4)} L${x2} ${y} L${x2 + dir * 5} ${y + (arriba ? 5 : -5)}"/>`;
    };
    const fl = $('flechas');
    fl.innerHTML = arco(c('BI'), fin.BI + ancho('BI') / 2, true) + arco(c('BLIO'), fin.BLIO + ancho('BLIO') / 2, false) +
      arco(c('TE'), fin.TE + ancho('TE') / 2, true) + arco(c('CA'), fin.CA + ancho('CA') / 2, false);
    fl.animate([{ opacity: 1 }, { opacity: 1, offset: .62 }, { opacity: 0 }], { duration: 3600, fill: 'forwards', easing: 'ease-in' });
    // each syllable from its place to the right one; the ones that jump, in an arc (over or under)
    const SALTO = { BI: -16, BLIO: 7, TE: -14, CA: 7 }, ESPERA = 900, VIAJE = 2300;
    SIL.forEach(s => {
      const k = TORCIDO[s], mx = (ini[s] + fin[s]) / 2;
      span[s].animate([
        { transform: t(s, ini[s], 0, 0) },
        { transform: t(s, mx, SALTO[s], k.r * 2), offset: .5 },
        { transform: t(s, fin[s], k.y, k.r) },
      ], { duration: VIAJE, delay: ESPERA + (s === 'TE' || s === 'CA' ? 350 : 0), fill: 'forwards', easing: 'ease-in-out' });
    });
  }
  document.fonts.ready.then(armar);

  window.__biblioteca = { dificultad: () => Est.dificultad };
})();
</script>
</body>
</html>
